<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creează cont | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      border-bottom: 1px solid #1d2330;

      background: rgba(8, 11, 18, .94);
      backdrop-filter: blur(15px);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-button {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111722;
      border: 1px solid #252e3d;
      border-radius: 11px;

      color: white;
      text-decoration: none;

      font-size: 20px;

      transition: .2s;
    }

    .back-button:hover {
      background: #161d29;
      border-color: #5b8cff;
    }

    .site-link {
      color: #9ba8bd;

      text-decoration: none;

      font-size: 14px;
      font-weight: 600;

      padding: 9px 13px;
      border-radius: 9px;

      transition: .2s;
    }

    .site-link:hover {
      color: white;
      background: #111722;
    }

    main {
      min-height: calc(100vh - 72px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 45px 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-area img {
      width: 76px;
      height: 76px;

      border-radius: 19px;
      object-fit: cover;

      margin-bottom: 18px;
    }

    .logo-area h1 {
      font-size: 32px;
      letter-spacing: -1.4px;

      margin-bottom: 8px;
    }

    .logo-area h1 span {
      color: #5b8cff;
    }

    .logo-area p {
      color: #7f8a9e;

      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: #0e131d;

      border: 1px solid #202735;
      border-radius: 20px;

      padding: 28px;
    }

    .card-title {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .card-description {
      color: #7f8a9e;

      font-size: 13px;
      line-height: 1.5;

      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #b9c2d1;

      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      background: #090d15;

      border: 1px solid #293243;
      border-radius: 10px;

      color: white;

      font-family: inherit;
      font-size: 16px;

      outline: none;

      transition: .2s;
    }

    input:focus {
      border-color: #5b8cff;

      box-shadow:
        0 0 0 3px rgba(91, 140, 255, .10);
    }

    input::placeholder {
      color: #586477;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 8px;

      background: transparent;
      color: #8491a6;

      cursor: pointer;

      font-size: 17px;
    }

    .show-password:hover {
      background: #151b26;
      color: white;
    }

    .primary {
      width: 100%;

      padding: 13px 16px;

      border: 0;
      border-radius: 10px;

      background: #5b8cff;
      color: white;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .primary:hover {
      background: #6c98ff;
    }

    .primary:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .separator {
      display: flex;
      align-items: center;

      gap: 13px;

      margin: 22px 0;

      color: #606c80;

      font-size: 12px;
    }

    .separator::before,
    .separator::after {
      content: "";

      height: 1px;
      flex: 1;

      background: #252c39;
    }

    .google-button {
      width: 100%;
      min-height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      padding: 11px 15px;

      background: #111722;

      border: 1px solid #293243;
      border-radius: 10px;

      color: white;

      font-family: inherit;
      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    .google-button:hover {
      border-color: #46536a;
      background: #151c28;
    }

    .google-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .google-icon {
      width: 22px;
      height: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;

      border-radius: 50%;

      color: #4285f4;

      font-size: 14px;
      font-weight: 800;
    }

    #status {
      display: none;

      margin-top: 17px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.45;
    }

    #status.error {
      display: block;

      color: #ff9292;

      background: rgba(255, 80, 80, .08);

      border:
        1px solid rgba(255, 80, 80, .20);
    }

    #status.success {
      display: block;

      color: #75e4a4;

      background: rgba(67, 211, 126, .08);

      border:
        1px solid rgba(67, 211, 126, .20);
    }

    .login-link {
      margin-top: 23px;
      padding-top: 21px;

      border-top: 1px solid #202735;

      text-align: center;

      color: #7f8a9e;

      font-size: 13px;
    }

    .login-link a {
      color: #7ca2ff;

      text-decoration: none;
      font-weight: 700;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .info {
      margin-top: 20px;

      color: #566174;

      font-size: 11px;
      line-height: 1.5;

      text-align: center;
    }

    @media (max-width: 600px) {
      nav {
        padding: 0 16px;
      }

      main {
        align-items: flex-start;

        padding:
          32px 16px 50px;
      }

      .card {
        padding: 23px 18px;

        border-radius: 17px;
      }

      .logo-area img {
        width: 68px;
        height: 68px;
      }

      .logo-area h1 {
        font-size: 28px;
      }

      .site-link {
        font-size: 13px;

        padding: 8px 9px;
      }
    }
  </style>
</head>

<body>

<nav>

  <a
    href="/login/"
    class="back-button"
    aria-label="Înapoi la Login"
    title="Înapoi la Login"
  >
    ←
  </a>

  <a
    href="/"
    class="site-link"
  >
    Înapoi la site
  </a>

</nav>


<main>

  <div class="container">

    <div class="logo-area">

      <img
        src="/logo.png"
        alt="VladLab"
      >

      <h1>
        Vlad<span>Lab</span>
      </h1>

      <p>
        Creează-ți contul VladLab.
      </p>

    </div>


    <div class="card">

      <h2 class="card-title">
        Creează cont
      </h2>

      <p class="card-description">
        Completează datele de mai jos sau continuă cu Google.
      </p>


      <form id="signupForm">

        <div class="field">

          <label for="name">
            Nume
          </label>

          <input
            id="name"
            type="text"
            autocomplete="name"
            placeholder="Numele tău"
            maxlength="40"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="nume@email.com"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Parolă
          </label>

          <div class="password-wrapper">

            <input
              id="password"
              type="password"
              autocomplete="new-password"
              placeholder="Minimum 6 caractere"
              minlength="6"
              required
            >

            <button
              class="show-password"
              id="showPassword"
              type="button"
              aria-label="Arată parola"
            >
              👁
            </button>

          </div>

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirmă parola
          </label>

          <div class="password-wrapper">

            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Scrie parola din nou"
              minlength="6"
              required
            >

            <button
              class="show-password"
              id="showConfirmPassword"
              type="button"
              aria-label="Arată parola"
            >
              👁
            </button>

          </div>

        </div>


        <button
          id="signupButton"
          class="primary"
          type="submit"
        >
          Creează cont
        </button>

      </form>


      <div class="separator">
        SAU
      </div>


      <button
        id="googleButton"
        class="google-button"
        type="button"
      >

        <span class="google-icon">
          G
        </span>

        Continuă cu Google

      </button>


      <div id="status"></div>


      <div class="login-link">

        Ai deja cont?

        <a href="/login/">
          Login
        </a>

      </div>

    </div>


    <div class="info">
      După crearea contului vei putea folosi profilul,
      favoritele și celelalte funcții personale VladLab.
    </div>

  </div>

</main>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",

    authDomain:
      "vladlab-11887.firebaseapp.com",

    projectId:
      "vladlab-11887",

    storageBucket:
      "vladlab-11887.firebasestorage.app",

    messagingSenderId:
      "741561223788",

    appId:
      "1:741561223788:web:88ad3e62db87e32551a649",

    measurementId:
      "G-9XN16BVYRN"

  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const googleProvider =
    new GoogleAuthProvider();


  googleProvider.setCustomParameters({
    prompt: "select_account"
  });


  const signupForm =
    document.getElementById("signupForm");

  const nameInput =
    document.getElementById("name");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const confirmPasswordInput =
    document.getElementById("confirmPassword");

  const signupButton =
    document.getElementById("signupButton");

  const googleButton =
    document.getElementById("googleButton");

  const status =
    document.getElementById("status");


  /* =========================
     CREEAZĂ CONT
  ========================= */

  signupForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      clearStatus();


      const name =
        nameInput.value.trim();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;


      if (
        !name ||
        !email ||
        !password ||
        !confirmPassword
      ) {

        showError(
          "Completează toate câmpurile."
        );

        return;
      }


      if (name.length < 2) {

        showError(
          "Numele trebuie să aibă cel puțin 2 caractere."
        );

        return;
      }


      if (password.length < 6) {

        showError(
          "Parola trebuie să aibă minimum 6 caractere."
        );

        return;
      }


      if (
        password !==
        confirmPassword
      ) {

        showError(
          "Parolele nu coincid."
        );

        return;
      }


      setLoading(true);


      try {

        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          credential.user,
          {
            displayName: name
          }
        );


        showSuccess(
          "Contul a fost creat."
        );


        redirectUser(
          credential.user
        );

      }

      catch (error) {

        console.error(error);

        showError(
          getAuthErrorMessage(error)
        );

        setLoading(false);

      }

    }
  );


  /* =========================
     CONT CU GOOGLE
  ========================= */

  googleButton.addEventListener(
    "click",
    async () => {

      clearStatus();

      setLoading(true);


      try {

        const credential =
          await signInWithPopup(
            auth,
            googleProvider
          );


        showSuccess(
          "Contul Google a fost conectat."
        );


        redirectUser(
          credential.user
        );

      }

      catch (error) {

        console.error(error);


        if (
          error.code ===
          "auth/popup-closed-by-user"
        ) {

          clearStatus();
          setLoading(false);

          return;
        }


        showError(
          getAuthErrorMessage(error)
        );

        setLoading(false);

      }

    }
  );


  /* =========================
     PAROLE
  ========================= */

  setupPasswordToggle(
    "showPassword",
    passwordInput
  );


  setupPasswordToggle(
    "showConfirmPassword",
    confirmPasswordInput
  );


  function setupPasswordToggle(
    buttonId,
    input
  ) {

    const button =
      document.getElementById(
        buttonId
      );


    button.addEventListener(
      "click",
      () => {

        const hidden =
          input.type ===
          "password";


        input.type =
          hidden
            ? "text"
            : "password";


        button.textContent =
          hidden
            ? "🙈"
            : "👁";


        button.setAttribute(
          "aria-label",
          hidden
            ? "Ascunde parola"
            : "Arată parola"
        );

      }
    );

  }


  /* =========================
     REDIRECT
  ========================= */

  function redirectUser(user) {

    if (
      user.uid ===
      ADMIN_UID
    ) {

      window.location.replace(
        "/admin/"
      );

      return;
    }


    window.location.replace(
      "/"
    );

  }


  /* =========================
     LOADING
  ========================= */

  function setLoading(loading) {

    signupButton.disabled =
      loading;

    googleButton.disabled =
      loading;

    nameInput.disabled =
      loading;

    emailInput.disabled =
      loading;

    passwordInput.disabled =
      loading;

    confirmPasswordInput.disabled =
      loading;


    signupButton.textContent =
      loading
        ? "Se creează..."
        : "Creează cont";

  }


  /* =========================
     STATUS
  ========================= */

  function showError(message) {

    status.className =
      "error";

    status.textContent =
      message;

  }


  function showSuccess(message) {

    status.className =
      "success";

    status.textContent =
      message;

  }


  function clearStatus() {

    status.className = "";
    status.textContent = "";

  }


  /* =========================
     ERORI FIREBASE
  ========================= */

  function getAuthErrorMessage(error) {

    switch (error.code) {

      case "auth/email-already-in-use":
        return "Există deja un cont cu acest email.";

      case "auth/invalid-email":
        return "Adresa de email nu este validă.";

      case "auth/weak-password":
        return "Parola este prea slabă.";

      case "auth/network-request-failed":
        return "Eroare de conexiune. Verifică internetul și încearcă din nou.";

      case "auth/too-many-requests":
        return "Prea multe încercări. Încearcă din nou mai târziu.";

      case "auth/popup-blocked":
        return "Browserul a blocat fereastra Google. Permite ferestrele pop-up.";

      case "auth/operation-not-allowed":
        return "Această metodă de autentificare nu este activată încă în Firebase.";

      case "auth/account-exists-with-different-credential":
        return "Există deja un cont cu acest email folosind altă metodă de autentificare.";

      default:
        return "Contul nu a putut fi creat. Încearcă din nou.";

    }

  }

</script>

</body>

</html>
