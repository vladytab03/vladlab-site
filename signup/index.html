<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",
    authDomain: "vladlab-11887.firebaseapp.com",
    projectId: "vladlab-11887",
    storageBucket: "vladlab-11887.firebasestorage.app",
    messagingSenderId: "741561223788",
    appId: "1:741561223788:web:88ad3e62db87e32551a649",
    measurementId: "G-9XN16BVYRN"
  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const googleProvider =
    new GoogleAuthProvider();


  googleProvider.setCustomParameters({
    prompt: "select_account"
  });


  const signupForm =
    document.getElementById("signupForm");

  const nameInput =
    document.getElementById("name");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const confirmPasswordInput =
    document.getElementById("confirmPassword");

  const signupButton =
    document.getElementById("signupButton");

  const googleButton =
    document.getElementById("googleButton");

  const status =
    document.getElementById("status");


  const loginLink =
    document.querySelector(
      ".login-link a"
    );


  /* =========================
     NEXT
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const nextPage =
    getSafeNext(
      params.get("next")
    );


  /*
    Dacă utilizatorul apasă Login
    din pagina de creare cont,
    păstrăm destinația inițială.
  */

  if (
    nextPage !== "/"
  ) {

    loginLink.href =
      "/login/?next=" +
      encodeURIComponent(
        nextPage
      );

  }


  function getSafeNext(value) {

    if (!value) {
      return "/";
    }


    try {

      const decoded =
        decodeURIComponent(
          value
        );


      /*
        Permitem numai rute interne.
      */

      if (
        !decoded.startsWith("/") ||
        decoded.startsWith("//")
      ) {

        return "/";

      }


      /*
        Evităm buclele login/signup.
      */

      if (
        decoded.startsWith("/login") ||
        decoded.startsWith("/signup")
      ) {

        return "/";

      }


      return decoded;

    }

    catch {

      return "/";

    }

  }


  /* =========================
     SALVEAZĂ PROFIL FIRESTORE
  ========================= */

  async function saveUserProfile(
    user,
    provider,
    preferredName = ""
  ) {

    const userRef =
      doc(
        db,
        "users",
        user.uid
      );


    const existing =
      await getDoc(
        userRef
      );


    const name =
      preferredName ||
      user.displayName ||
      user.email?.split("@")[0] ||
      "Utilizator";


    const baseData = {

      uid:
        user.uid,

      name:
        name,

      email:
        user.email || "",

      photoURL:
        user.photoURL || "",

      provider:
        provider,

      updatedAt:
        serverTimestamp()

    };


    if (
      !existing.exists()
    ) {

      await setDoc(
        userRef,
        {
          ...baseData,

          createdAt:
            serverTimestamp()
        }
      );

    }

    else {

      await setDoc(
        userRef,
        baseData,
        {
          merge: true
        }
      );

    }

  }


  /* =========================
     CREEAZĂ CONT
  ========================= */

  signupForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      clearStatus();


      const name =
        nameInput
          .value
          .trim();


      const email =
        emailInput
          .value
          .trim();


      const password =
        passwordInput.value;


      const confirmPassword =
        confirmPasswordInput.value;


      if (
        !name ||
        !email ||
        !password ||
        !confirmPassword
      ) {

        showError(
          "Completează toate câmpurile."
        );

        return;

      }


      if (
        name.length < 2
      ) {

        showError(
          "Numele trebuie să aibă cel puțin 2 caractere."
        );

        return;

      }


      if (
        password.length < 6
      ) {

        showError(
          "Parola trebuie să aibă minimum 6 caractere."
        );

        return;

      }


      if (
        password !==
        confirmPassword
      ) {

        showError(
          "Parolele nu coincid."
        );

        return;

      }


      setLoading(true);


      try {

        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          credential.user,
          {
            displayName:
              name
          }
        );


        await saveUserProfile(
          credential.user,
          "password",
          name
        );


        showSuccess(
          "Contul a fost creat."
        );


        redirectUser(
          credential.user
        );

      }

      catch (error) {

        console.error(
          error
        );


        showError(
          getAuthErrorMessage(
            error
          )
        );


        setLoading(false);

      }

    }
  );


  /* =========================
     CONT GOOGLE
  ========================= */

  googleButton.addEventListener(
    "click",
    async () => {

      clearStatus();

      setLoading(true);


      try {

        const credential =
          await signInWithPopup(
            auth,
            googleProvider
          );


        await saveUserProfile(
          credential.user,
          "google"
        );


        showSuccess(
          "Contul Google a fost conectat."
        );


        redirectUser(
          credential.user
        );

      }

      catch (error) {

        console.error(
          error
        );


        if (
          error.code ===
          "auth/popup-closed-by-user"
        ) {

          clearStatus();

          setLoading(false);

          return;

        }


        showError(
          getAuthErrorMessage(
            error
          )
        );


        setLoading(false);

      }

    }
  );


  /* =========================
     PAROLE
  ========================= */

  setupPasswordToggle(
    "showPassword",
    passwordInput
  );


  setupPasswordToggle(
    "showConfirmPassword",
    confirmPasswordInput
  );


  function setupPasswordToggle(
    buttonId,
    input
  ) {

    const button =
      document.getElementById(
        buttonId
      );


    button.addEventListener(
      "click",
      () => {

        const hidden =
          input.type ===
          "password";


        input.type =
          hidden
            ? "text"
            : "password";


        button.textContent =
          hidden
            ? "🙈"
            : "👁";


        button.setAttribute(
          "aria-label",
          hidden
            ? "Ascunde parola"
            : "Arată parola"
        );

      }
    );

  }


  /* =========================
     REDIRECT
  ========================= */

  function redirectUser(user) {

    /*
      Adminul intră întotdeauna
      în panoul Admin.
    */

    if (
      user.uid ===
      ADMIN_UID
    ) {

      window.location.replace(
        "/admin/"
      );

      return;

    }


    /*
      Cont normal:
      mergem la pagina cerută
      prin ?next=.
    */

    window.location.replace(
      nextPage
    );

  }


  /* =========================
     LOADING
  ========================= */

  function setLoading(loading) {

    signupButton.disabled =
      loading;

    googleButton.disabled =
      loading;

    nameInput.disabled =
      loading;

    emailInput.disabled =
      loading;

    passwordInput.disabled =
      loading;

    confirmPasswordInput.disabled =
      loading;


    signupButton.textContent =
      loading
        ? "Se creează..."
        : "Creează cont";

  }


  /* =========================
     STATUS
  ========================= */

  function showError(message) {

    status.className =
      "error";

    status.textContent =
      message;

  }


  function showSuccess(message) {

    status.className =
      "success";

    status.textContent =
      message;

  }


  function clearStatus() {

    status.className =
      "";

    status.textContent =
      "";

  }


  /* =========================
     ERORI FIREBASE
  ========================= */

  function getAuthErrorMessage(error) {

    switch (
      error.code
    ) {

      case "auth/email-already-in-use":
        return "Există deja un cont cu acest email.";

      case "auth/invalid-email":
        return "Adresa de email nu este validă.";

      case "auth/weak-password":
        return "Parola este prea slabă.";

      case "auth/network-request-failed":
        return "Eroare de conexiune. Verifică internetul și încearcă din nou.";

      case "auth/too-many-requests":
        return "Prea multe încercări. Încearcă din nou mai târziu.";

      case "auth/popup-blocked":
        return "Browserul a blocat fereastra Google. Permite ferestrele pop-up.";

      case "auth/operation-not-allowed":
        return "Această metodă de autentificare nu este activată încă în Firebase.";

      case "auth/account-exists-with-different-credential":
        return "Există deja un cont cu acest email folosind altă metodă de autentificare.";

      case "permission-denied":
        return "Contul a fost creat, dar profilul nu a putut fi salvat în Firestore.";

      default:
        return "Contul nu a putut fi creat. Încearcă din nou.";

    }

  }

</script>
