<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descărcări | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b12;
      color: white;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }


    /* =========================
       NAVBAR
    ========================= */

    nav {
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      border-bottom: 1px solid #1d2330;

      background: rgba(8, 11, 18, 0.94);

      position: sticky;
      top: 0;
      z-index: 100;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .menu-button {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0e131d;
      border: 1px solid #293142;
      border-radius: 12px;

      color: white;
      font-size: 24px;

      cursor: pointer;

      transition: 0.2s;
    }

    .menu-button:hover {
      background: #161c27;
      border-color: #5b8cff;
    }


    /* =========================
       LOGIN / USER
    ========================= */

    .account {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #loggedOut,
    #loggedIn {
      display: none;
    }

    .login-button,
    .user-button,
    .logout-button {
      border-radius: 10px;

      padding: 9px 15px;

      font-size: 14px;

      text-decoration: none;

      cursor: pointer;

      transition: 0.2s;

      white-space: nowrap;
    }

    .login-button {
      background: #5b8cff;

      color: white;

      border: 1px solid #5b8cff;

      font-weight: 700;
    }

    .login-button:hover {
      background: #6c98ff;
    }

    .user-button {
      background: transparent;

      color: #cbd4e4;

      border: 1px solid #293142;
    }

    .user-button:hover {
      color: white;

      border-color: #5b8cff;
    }

    .logout-button {
      background: #161c27;

      color: white;

      border: 1px solid #293142;
    }

    .logout-button:hover {
      background: #1a2230;

      border-color: #5b8cff;
    }


    /* =========================
       MENIU GLISANT
    ========================= */

    .menu-overlay {
      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.62);

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.25s, visibility 0.25s;

      z-index: 998;
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .side-menu {
      position: fixed;

      top: 0;
      left: 0;

      width: 320px;
      max-width: 86vw;

      height: 100vh;
      height: 100dvh;

      background: #0b0f17;

      border-right: 1px solid #202735;

      transform: translateX(-105%);

      transition: transform 0.28s ease;

      z-index: 999;

      display: flex;
      flex-direction: column;

      box-shadow: 20px 0 50px rgba(0, 0, 0, 0.35);
    }

    .side-menu.active {
      transform: translateX(0);
    }

    .side-menu-header {
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      border-bottom: 1px solid #1d2330;
    }

    .side-brand {
      display: flex;
      align-items: center;

      gap: 11px;

      font-size: 19px;
      font-weight: 700;
    }

    .side-brand img {
      width: 40px;
      height: 40px;

      object-fit: cover;

      border-radius: 10px;
    }

    .close-menu {
      width: 40px;
      height: 40px;

      border-radius: 10px;

      border: 1px solid #293142;

      background: #111722;

      color: white;

      font-size: 23px;

      cursor: pointer;

      transition: 0.2s;
    }

    .close-menu:hover {
      border-color: #5b8cff;

      background: #161d2a;
    }

    .side-menu-content {
      padding: 20px 14px;

      display: flex;
      flex-direction: column;

      gap: 7px;

      overflow-y: auto;
    }

    .menu-label {
      color: #596477;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1.2px;

      padding: 6px 12px 10px;
    }

    .menu-link {
      display: flex;
      align-items: center;

      gap: 14px;

      min-height: 52px;

      padding: 12px 14px;

      border-radius: 12px;

      border: 1px solid transparent;

      color: #cbd4e4;

      text-decoration: none;

      font-size: 15px;
      font-weight: 600;

      transition: 0.2s;
    }

    .menu-link:hover {
      color: white;

      background: #111722;

      border-color: #202735;
    }

    .menu-link.active {
      color: white;

      background: rgba(91, 140, 255, 0.12);

      border-color: rgba(91, 140, 255, 0.25);
    }

    .menu-icon {
      width: 27px;

      text-align: center;

      font-size: 20px;
    }

    .menu-separator {
      height: 1px;

      background: #1d2330;

      margin: 12px 8px;
    }

    .side-menu-footer {
      margin-top: auto;

      padding: 18px 20px;

      border-top: 1px solid #1d2330;

      color: #596477;

      font-size: 12px;
    }


    /* =========================
       MAIN
    ========================= */

    main {
      flex: 1;

      width: min(1100px, 90%);

      margin: auto;

      padding: 80px 0;
    }

    .back {
      color: #71809a;

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    h1 {
      font-size: clamp(48px, 7vw, 72px);

      letter-spacing: -3px;

      margin-top: 25px;
    }

    h1 span {
      color: #5b8cff;
    }


    /* =========================
       DOWNLOADS
    ========================= */

    #downloadsList {
      margin-top: 45px;

      display: grid;

      gap: 16px;
    }

    .download-card {
      background: #0e131d;

      border: 1px solid #202735;

      border-radius: 18px;

      padding: 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 25px;

      transition: 0.2s;
    }

    .download-card:hover {
      border-color: #303b50;

      transform: translateY(-2px);
    }

    .download-info {
      min-width: 0;
    }

    .download-title {
      font-size: 18px;

      font-weight: 700;

      margin-bottom: 7px;

      overflow-wrap: anywhere;
    }

    .download-description {
      color: #7f899a;

      font-size: 14px;

      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    .download-button {
      flex-shrink: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 11px 17px;

      border-radius: 10px;

      background: #5b8cff;

      color: white;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;

      transition: 0.2s;
    }

    .download-button:hover {
      background: #6c98ff;
    }


    /* =========================
       EMPTY
    ========================= */

    .empty {
      min-height: 250px;

      border: 1px dashed #293243;

      border-radius: 18px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;
    }

    .empty-icon {
      font-size: 38px;

      margin-bottom: 18px;
    }

    .empty h2 {
      font-size: 19px;

      margin-bottom: 8px;
    }

    .empty p {
      color: #657188;

      font-size: 14px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #1d2330;

      padding: 30px 8%;

      color: #626d7f;

      font-size: 13px;

      display: flex;

      justify-content: space-between;
    }


    /* =========================
       TELEFON
    ========================= */

    @media (max-width: 750px) {

      nav {
        padding: 0 16px;
      }

      .menu-button {
        width: 42px;
        height: 42px;

        font-size: 22px;
      }

      main {
        width: calc(100% - 36px);

        padding-top: 55px;
        padding-bottom: 60px;
      }

      h1 {
        font-size: clamp(40px, 12vw, 58px);

        letter-spacing: -2px;
      }

      footer {
        flex-direction: column;

        gap: 10px;

        padding-left: 18px;
        padding-right: 18px;
      }

      .login-button,
      .user-button,
      .logout-button {
        padding: 8px 10px;

        font-size: 13px;
      }

      #loggedIn {
        gap: 6px;
      }

      .download-card {
        flex-direction: column;

        align-items: stretch;
      }

      .download-button {
        width: 100%;
      }

      .side-menu {
        width: 300px;
      }

    }


    @media (max-width: 380px) {

      nav {
        padding-left: 12px;
        padding-right: 12px;
      }

      .user-button,
      .logout-button {
        padding-left: 8px;
        padding-right: 8px;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     MENIU GLISANT
========================= -->

<div
  id="menuOverlay"
  class="menu-overlay"
></div>


<aside
  id="sideMenu"
  class="side-menu"
>

  <div class="side-menu-header">

    <div class="side-brand">

      <img
        src="/logo.png"
        alt="VladLab"
      >

      VladLab

    </div>


    <button
      id="closeMenu"
      class="close-menu"
      type="button"
      aria-label="Închide meniul"
    >
      ×
    </button>

  </div>


  <div class="side-menu-content">

    <div class="menu-label">
      VLADLAB
    </div>


    <a href="/" class="menu-link">

      <span class="menu-icon">
        🏠
      </span>

      Acasă

    </a>


    <a href="/scoala/" class="menu-link">

      <span class="menu-icon">
        🎓
      </span>

      Școală

    </a>


    <a href="/proiecte/" class="menu-link">

      <span class="menu-icon">
        💻
      </span>

      Proiecte

    </a>


    <a href="/upload/" class="menu-link">

      <span class="menu-icon">
        📤
      </span>

      Trimite fișier

    </a>


    <a
      href="/download/"
      class="menu-link active"
    >

      <span class="menu-icon">
        📥
      </span>

      Descărcări

    </a>


    <div class="menu-separator"></div>


    <a
      href="http://novasmp.space/"
      class="menu-link"
    >

      <span class="menu-icon">
        ⛏️
      </span>

      Nova SMP

    </a>

  </div>


  <div class="side-menu-footer">
    © 2026 VladLab
  </div>

</aside>


<!-- =========================
     NAVBAR
========================= -->

<nav>

  <button
    id="openMenu"
    class="menu-button"
    type="button"
    aria-label="Deschide meniul"
  >
    ☰
  </button>


  <div class="account">


    <!-- NELOGAT -->

    <div id="loggedOut">

      <a
        href="/login/"
        class="login-button"
      >
        Login
      </a>

    </div>


    <!-- LOGAT -->

    <div
      id="loggedIn"
      class="account"
    >

      <a
        href="/admin/"
        class="user-button"
      >
        Vlad
      </a>


      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<main>

  <a
    href="/"
    class="back"
  >
    ← Înapoi la VladLab
  </a>


  <h1>
    📥 <span>Descărcări</span>
  </h1>


  <div id="downloadsList">

    <div class="empty">

      <div class="empty-icon">
        ⏳
      </div>

      <h2>
        Se încarcă...
      </h2>

      <p>
        Se verifică fișierele disponibile.
      </p>

    </div>

  </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

  <div>
    © 2026 VladLab
  </div>

  <div>
    Descărcări
  </div>

</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",

    authDomain:
      "vladlab-11887.firebaseapp.com",

    projectId:
      "vladlab-11887",

    storageBucket:
      "vladlab-11887.firebasestorage.app",

    messagingSenderId:
      "741561223788",

    appId:
      "1:741561223788:web:88ad3e62db87e32551a649",

    measurementId:
      "G-9XN16BVYRN"

  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  /* =========================
     LOGIN / LOGOUT
  ========================= */

  const loggedOut =
    document.getElementById("loggedOut");

  const loggedIn =
    document.getElementById("loggedIn");

  const logoutButton =
    document.getElementById("logoutButton");


  onAuthStateChanged(
    auth,

    (user) => {

      if (
        user &&
        user.uid === ADMIN_UID
      ) {

        loggedOut.style.display =
          "none";

        loggedIn.style.display =
          "flex";

      }

      else {

        loggedIn.style.display =
          "none";

        loggedOut.style.display =
          "block";

      }

    }
  );


  logoutButton.addEventListener(
    "click",

    async () => {

      await signOut(auth);

      window.location.reload();

    }
  );


  /* =========================
     MENIU GLISANT
  ========================= */

  const openMenuButton =
    document.getElementById("openMenu");

  const closeMenuButton =
    document.getElementById("closeMenu");

  const sideMenu =
    document.getElementById("sideMenu");

  const menuOverlay =
    document.getElementById("menuOverlay");


  function openMenu() {

    sideMenu.classList.add("active");

    menuOverlay.classList.add("active");

    document.body.classList.add("menu-open");

  }


  function closeMenu() {

    sideMenu.classList.remove("active");

    menuOverlay.classList.remove("active");

    document.body.classList.remove("menu-open");

  }


  openMenuButton.addEventListener(
    "click",
    openMenu
  );


  closeMenuButton.addEventListener(
    "click",
    closeMenu
  );


  menuOverlay.addEventListener(
    "click",
    closeMenu
  );


  document
    .querySelectorAll(".menu-link")
    .forEach((link) => {

      link.addEventListener(
        "click",
        closeMenu
      );

    });


  document.addEventListener(
    "keydown",

    (event) => {

      if (event.key === "Escape") {
        closeMenu();
      }

    }
  );


  /* =========================
     DESCĂRCĂRI DIN FIRESTORE
  ========================= */

  const downloadsList =
    document.getElementById("downloadsList");


  const downloadsQuery =
    query(
      collection(db, "downloads"),
      orderBy("createdAt", "desc")
    );


  onSnapshot(

    downloadsQuery,

    (snapshot) => {

      downloadsList.innerHTML = "";


      /* NICIUN FIȘIER */

      if (snapshot.empty) {

        downloadsList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              📂
            </div>

            <h2>
              Momentan nu există fișiere.
            </h2>

            <p>
              Fișierele disponibile pentru descărcare vor apărea aici.
            </p>

          </div>
        `;

        return;

      }


      /* AFIȘARE FIȘIERE */

      snapshot.forEach(
        (documentSnapshot) => {

          const data =
            documentSnapshot.data();


          const card =
            document.createElement("div");

          card.className =
            "download-card";


          const info =
            document.createElement("div");

          info.className =
            "download-info";


          const title =
            document.createElement("div");

          title.className =
            "download-title";

          title.textContent =
            data.title || "Fișier";


          info.appendChild(title);


          if (data.description) {

            const description =
              document.createElement("div");

            description.className =
              "download-description";

            description.textContent =
              data.description;

            info.appendChild(description);

          }


          const button =
            document.createElement("a");

          button.className =
            "download-button";

          button.textContent =
            "Descarcă";


          /* ACCEPTĂ DOAR HTTP / HTTPS */

          try {

            const fileUrl =
              new URL(data.url);

            if (
              fileUrl.protocol === "https:" ||
              fileUrl.protocol === "http:"
            ) {

              button.href =
                fileUrl.href;

              button.target =
                "_blank";

              button.rel =
                "noopener noreferrer";

            }

            else {

              button.removeAttribute(
                "href"
              );

              button.textContent =
                "Link indisponibil";

            }

          }

          catch {

            button.removeAttribute(
              "href"
            );

            button.textContent =
              "Link indisponibil";

          }


          card.appendChild(info);

          card.appendChild(button);

          downloadsList.appendChild(card);

        }
      );

    },


    (error) => {

      console.error(error);

      downloadsList.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          <h2>
            Nu am putut încărca fișierele.
          </h2>

          <p>
            Încearcă din nou mai târziu.
          </p>

        </div>
      `;

    }

  );

</script>

</body>
</html>
