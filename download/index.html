<!DOCTYPE html>
<html lang="ro">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descărcări | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b12;
      color: white;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }


    /* NAVBAR */

    nav {
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 8%;

      border-bottom: 1px solid #1d2330;

      background: rgba(8, 11, 18, 0.92);

      position: sticky;
      top: 0;
      z-index: 10;

      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;

      gap: 11px;

      text-decoration: none;

      color: white;
    }

    .logo img {
      width: 44px;
      height: 44px;

      border-radius: 11px;

      object-fit: cover;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 800;

      letter-spacing: -1px;
    }

    .logo-text span {
      color: #5b8cff;
    }


    /* LOGIN / USER */

    .account {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    #loggedOut,
    #loggedIn {
      display: none;
    }

    .login-button,
    .user-button,
    .logout-button {
      border-radius: 10px;

      padding: 9px 15px;

      font-size: 14px;

      text-decoration: none;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-button {
      background: #5b8cff;

      color: white;

      border: 1px solid #5b8cff;

      font-weight: 700;
    }

    .login-button:hover {
      background: #6c98ff;
    }

    .user-button {
      background: transparent;

      color: #cbd4e4;

      border: 1px solid #293142;
    }

    .user-button:hover {
      color: white;

      border-color: #5b8cff;
    }

    .logout-button {
      background: #161c27;

      color: white;

      border: 1px solid #293142;
    }

    .logout-button:hover {
      background: #1a2230;

      border-color: #5b8cff;
    }


    /* MAIN */

    main {
      flex: 1;

      width: min(1100px, 90%);

      margin: auto;

      padding: 80px 0;
    }

    .back {
      color: #71809a;

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    h1 {
      font-size: clamp(48px, 7vw, 72px);

      letter-spacing: -3px;

      margin-top: 25px;
    }

    h1 span {
      color: #5b8cff;
    }


    /* EMPTY */

    .empty {
      margin-top: 45px;

      min-height: 250px;

      border: 1px dashed #293243;

      border-radius: 18px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;
    }

    .empty-icon {
      font-size: 38px;

      margin-bottom: 18px;
    }

    .empty h2 {
      font-size: 19px;

      margin-bottom: 8px;
    }

    .empty p {
      color: #657188;

      font-size: 14px;
    }


    /* FOOTER */

    footer {
      border-top: 1px solid #1d2330;

      padding: 30px 8%;

      color: #626d7f;

      font-size: 13px;

      display: flex;

      justify-content: space-between;
    }


    /* MOBILE */

    @media (max-width: 750px) {

      nav {
        padding: 0 5%;
      }

      main {
        padding-top: 55px;
      }

      footer {
        flex-direction: column;

        gap: 10px;
      }

      .login-button,
      .user-button,
      .logout-button {
        padding: 8px 11px;
      }

    }

  </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

  <a href="/" class="logo">

    <img src="/logo.png" alt="VladLab">

    <div class="logo-text">
      Vlad<span>Lab</span>
    </div>

  </a>


  <div class="account">

    <!-- NELOGAT -->

    <div id="loggedOut">

      <a href="/login/" class="login-button">
        Login
      </a>

    </div>


    <!-- LOGAT -->

    <div id="loggedIn" class="account">

      <a href="/admin/" class="user-button">
        Vlad
      </a>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</nav>


<!-- MAIN -->

<main>

  <a href="/" class="back">
    ← Înapoi la VladLab
  </a>


  <h1>
    📥 <span>Descărcări</span>
  </h1>


  <div class="empty">

    <div class="empty-icon">
      📂
    </div>

    <h2>
      Momentan nu există fișiere.
    </h2>

    <p>
      Fișierele disponibile pentru descărcare vor apărea aici.
    </p>

  </div>

</main>


<!-- FOOTER -->

<footer>

  <div>
    © 2026 VladLab
  </div>

  <div>
    Descărcări
  </div>

</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",

    authDomain:
      "vladlab-11887.firebaseapp.com",

    projectId:
      "vladlab-11887",

    storageBucket:
      "vladlab-11887.firebasestorage.app",

    messagingSenderId:
      "741561223788",

    appId:
      "1:741561223788:web:88ad3e62db87e32551a649",

    measurementId:
      "G-9XN16BVYRN"

  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const loggedOut =
    document.getElementById("loggedOut");

  const loggedIn =
    document.getElementById("loggedIn");

  const logoutButton =
    document.getElementById("logoutButton");


  onAuthStateChanged(auth, (user) => {

    if (
      user &&
      user.uid === ADMIN_UID
    ) {

      loggedOut.style.display =
        "none";

      loggedIn.style.display =
        "flex";

    }

    else {

      loggedIn.style.display =
        "none";

      loggedOut.style.display =
        "block";

    }

  });


  logoutButton.addEventListener(
    "click",

    async () => {

      await signOut(auth);

      window.location.reload();

    }
  );

</script>


</body>

</html>
