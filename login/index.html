<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      height: 72px;
      border-bottom: 1px solid #1d2330;
      background: rgba(8, 11, 18, 0.94);
      backdrop-filter: blur(15px);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-button {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111722;
      border: 1px solid #252e3d;
      border-radius: 11px;

      color: white;
      text-decoration: none;

      font-size: 20px;

      transition: .2s;
    }

    .back-button:hover {
      background: #161d29;
      border-color: #5b8cff;
    }

    .site-link {
      color: #9ba8bd;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;

      padding: 9px 13px;
      border-radius: 9px;

      transition: .2s;
    }

    .site-link:hover {
      color: white;
      background: #111722;
    }

    main {
      min-height: calc(100vh - 72px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 45px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-area img {
      width: 76px;
      height: 76px;

      border-radius: 19px;
      object-fit: cover;

      margin-bottom: 18px;
    }

    .logo-area h1 {
      font-size: 32px;
      letter-spacing: -1.4px;
      margin-bottom: 8px;
    }

    .logo-area h1 span {
      color: #5b8cff;
    }

    .logo-area p {
      color: #7f8a9e;
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: #0e131d;
      border: 1px solid #202735;
      border-radius: 20px;

      padding: 28px;
    }

    .card-title {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .card-description {
      color: #7f8a9e;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #b9c2d1;

      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      background: #090d15;
      border: 1px solid #293243;
      border-radius: 10px;

      color: white;

      font-family: inherit;
      font-size: 16px;

      outline: none;

      transition: .2s;
    }

    input:focus {
      border-color: #5b8cff;
      box-shadow: 0 0 0 3px rgba(91, 140, 255, .10);
    }

    input::placeholder {
      color: #586477;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 8px;

      background: transparent;
      color: #8491a6;

      cursor: pointer;

      font-size: 17px;
    }

    .show-password:hover {
      background: #151b26;
      color: white;
    }

    .login-button {
      width: 100%;

      padding: 13px 16px;

      border: 0;
      border-radius: 10px;

      background: #5b8cff;
      color: white;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .login-button:hover {
      background: #6c98ff;
    }

    .login-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .separator {
      display: flex;
      align-items: center;
      gap: 13px;

      margin: 22px 0;

      color: #606c80;

      font-size: 12px;
    }

    .separator::before,
    .separator::after {
      content: "";

      height: 1px;
      flex: 1;

      background: #252c39;
    }

    .google-button {
      width: 100%;

      min-height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      padding: 11px 15px;

      background: #111722;
      border: 1px solid #293243;
      border-radius: 10px;

      color: white;

      font-family: inherit;
      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    .google-button:hover {
      border-color: #46536a;
      background: #151c28;
    }

    .google-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .google-icon {
      width: 22px;
      height: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;
      border-radius: 50%;

      color: #4285f4;

      font-size: 14px;
      font-weight: 800;
    }

    #status {
      display: none;

      margin-top: 17px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.45;
    }

    #status.error {
      display: block;

      color: #ff9292;

      background: rgba(255, 80, 80, .08);
      border: 1px solid rgba(255, 80, 80, .20);
    }

    #status.success {
      display: block;

      color: #75e4a4;

      background: rgba(67, 211, 126, .08);
      border: 1px solid rgba(67, 211, 126, .20);
    }

    .signup {
      margin-top: 23px;

      padding-top: 21px;

      border-top: 1px solid #202735;

      text-align: center;

      color: #7f8a9e;

      font-size: 13px;
    }

    .signup a {
      color: #7ca2ff;
      text-decoration: none;
      font-weight: 700;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    .privacy {
      margin-top: 20px;

      color: #566174;

      font-size: 11px;
      line-height: 1.5;

      text-align: center;
    }

    @media (max-width: 600px) {
      nav {
        padding: 0 16px;
      }

      main {
        align-items: flex-start;
        padding: 32px 16px 50px;
      }

      .card {
        padding: 23px 18px;
        border-radius: 17px;
      }

      .logo-area img {
        width: 68px;
        height: 68px;
      }

      .logo-area h1 {
        font-size: 28px;
      }

      .site-link {
        font-size: 13px;
        padding: 8px 9px;
      }
    }
  </style>
</head>

<body>

<nav>

  <a
    href="/"
    class="back-button"
    aria-label="Înapoi la site"
    title="Înapoi la site"
  >
    ←
  </a>

  <a
    href="/"
    class="site-link"
  >
    Înapoi la site
  </a>

</nav>


<main>

  <div class="login-container">

    <div class="logo-area">

      <img
        src="/logo.png"
        alt="VladLab"
      >

      <h1>
        Vlad<span>Lab</span>
      </h1>

      <p>
        Conectează-te la contul tău.
      </p>

    </div>


    <div class="card">

      <h2 class="card-title">
        Login
      </h2>

      <p class="card-description">
        Introdu emailul și parola sau continuă cu Google.
      </p>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="nume@email.com"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Parolă
          </label>

          <div class="password-wrapper">

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Parola ta"
              required
            >

            <button
              id="showPassword"
              class="show-password"
              type="button"
              aria-label="Arată parola"
              title="Arată parola"
            >
              👁
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          Login
        </button>

      </form>


      <div class="separator">
        SAU
      </div>


      <button
        id="googleButton"
        class="google-button"
        type="button"
      >

        <span class="google-icon">
          G
        </span>

        Continuă cu Google

      </button>


      <div id="status"></div>


      <div class="signup">

        Nu ai cont?

        <a id="signupLink" href="/signup/">
          Creează cont
        </a>

      </div>

    </div>


    <div class="privacy">
      Contul tău este folosit pentru funcțiile personale VladLab,
      precum profilul, favoritele și fișierele trimise.
    </div>

  </div>

</main>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",
    authDomain: "vladlab-11887.firebaseapp.com",
    projectId: "vladlab-11887",
    storageBucket: "vladlab-11887.firebasestorage.app",
    messagingSenderId: "741561223788",
    appId: "1:741561223788:web:88ad3e62db87e32551a649",
    measurementId: "G-9XN16BVYRN"
  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const googleProvider =
    new GoogleAuthProvider();


  googleProvider.setCustomParameters({
    prompt: "select_account"
  });


  const loginForm =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const googleButton =
    document.getElementById("googleButton");

  const status =
    document.getElementById("status");

  const showPassword =
    document.getElementById("showPassword");

  const signupLink =
    document.getElementById("signupLink");


  let loginStarted =
    false;


  /* =========================
     NEXT
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const nextPage =
    getSafeNext(
      params.get("next")
    );


  if (nextPage !== "/") {

    signupLink.href =
      "/signup/?next=" +
      encodeURIComponent(nextPage);

  }


  function getSafeNext(value) {

    if (!value) {
      return "/";
    }


    try {

      const decoded =
        decodeURIComponent(value);


      /*
        Acceptăm doar rute interne VladLab.

        Nu permitem:
        https://...
        http://...
        //alt-site.ro
      */

      if (
        !decoded.startsWith("/") ||
        decoded.startsWith("//")
      ) {

        return "/";

      }


      /*
        Nu permitem redirect către login/signup
        pentru a evita buclele.
      */

      if (
        decoded.startsWith("/login") ||
        decoded.startsWith("/signup")
      ) {

        return "/";

      }


      return decoded;

    }

    catch {

      return "/";

    }

  }


  /* =========================
     UTILIZATOR DEJA CONECTAT
  ========================= */

  onAuthStateChanged(
    auth,
    user => {

      if (
        !user ||
        loginStarted
      ) {

        return;

      }


      redirectUser(
        user
      );

    }
  );


  /* =========================
     LOGIN EMAIL + PAROLĂ
  ========================= */

  loginForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      clearStatus();


      const email =
        emailInput
          .value
          .trim();


      const password =
        passwordInput.value;


      if (
        !email ||
        !password
      ) {

        showError(
          "Completează emailul și parola."
        );

        return;

      }


      setLoading(true);

      loginStarted =
        true;


      try {

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        await saveUserProfile(
          credential.user,
          "password"
        );


        showSuccess(
          "Autentificare reușită."
        );


        redirectUser(
          credential.user
        );

      }

      catch (error) {

        loginStarted =
          false;


        console.error(error);


        showError(
          getAuthErrorMessage(error)
        );


        setLoading(false);

      }

    }
  );


  /* =========================
     LOGIN GOOGLE
  ========================= */

  googleButton.addEventListener(
    "click",
    async () => {

      clearStatus();

      setLoading(true);

      loginStarted =
        true;


      try {

        const credential =
          await signInWithPopup(
            auth,
            googleProvider
          );


        await saveUserProfile(
          credential.user,
          "google"
        );


        showSuccess(
          "Autentificare cu Google reușită."
        );


        redirectUser(
          credential.user
        );

      }

      catch (error) {

        loginStarted =
          false;


        console.error(error);


        if (
          error.code ===
          "auth/popup-closed-by-user"
        ) {

          clearStatus();

          setLoading(false);

          return;

        }


        showError(
          getAuthErrorMessage(error)
        );


        setLoading(false);

      }

    }
  );


  /* =========================
     PROFIL FIRESTORE
  ========================= */

  async function saveUserProfile(
    user,
    provider
  ) {

    if (!user) {
      return;
    }


    const userRef =
      doc(
        db,
        "users",
        user.uid
      );


    const existing =
      await getDoc(
        userRef
      );


    const data = {
      uid:
        user.uid,

      name:
        user.displayName ||
        user.email?.split("@")[0] ||
        "Utilizator",

      email:
        user.email ||
        "",

      photoURL:
        user.photoURL ||
        "",

      provider:
        provider,

      updatedAt:
        serverTimestamp()
    };


    if (!existing.exists()) {

      data.createdAt =
        serverTimestamp();

    }


    await setDoc(
      userRef,
      data,
      {
        merge: true
      }
    );

  }


  /* =========================
     PAROLĂ VIZIBILĂ
  ========================= */

  showPassword.addEventListener(
    "click",
    () => {

      const hidden =
        passwordInput.type ===
        "password";


      passwordInput.type =
        hidden
          ? "text"
          : "password";


      showPassword.textContent =
        hidden
          ? "🙈"
          : "👁";


      showPassword.setAttribute(
        "aria-label",
        hidden
          ? "Ascunde parola"
          : "Arată parola"
      );

    }
  );


  /* =========================
     REDIRECT
  ========================= */

  function redirectUser(user) {

    /*
      Adminul merge întotdeauna
      în panoul Admin.
    */

    if (
      user.uid ===
      ADMIN_UID
    ) {

      window.location.replace(
        "/admin/"
      );

      return;

    }


    /*
      Utilizator normal:
      dacă există ?next= îl trimitem
      exact unde voia să ajungă.
    */

    window.location.replace(
      nextPage
    );

  }


  /* =========================
     STATUS
  ========================= */

  function showError(message) {

    status.className =
      "error";

    status.textContent =
      message;

  }


  function showSuccess(message) {

    status.className =
      "success";

    status.textContent =
      message;

  }


  function clearStatus() {

    status.className =
      "";

    status.textContent =
      "";

  }


  /* =========================
     LOADING
  ========================= */

  function setLoading(loading) {

    loginButton.disabled =
      loading;

    googleButton.disabled =
      loading;

    emailInput.disabled =
      loading;

    passwordInput.disabled =
      loading;


    loginButton.textContent =
      loading
        ? "Se conectează..."
        : "Login";

  }


  /* =========================
     ERORI FIREBASE
  ========================= */

  function getAuthErrorMessage(error) {

    switch (error.code) {

      case "auth/invalid-email":
        return "Adresa de email nu este validă.";

      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found":
        return "Email sau parolă incorectă.";

      case "auth/user-disabled":
        return "Acest cont a fost dezactivat.";

      case "auth/too-many-requests":
        return "Prea multe încercări. Încearcă din nou mai târziu.";

      case "auth/network-request-failed":
        return "Eroare de conexiune. Verifică internetul și încearcă din nou.";

      case "auth/popup-blocked":
        return "Browserul a blocat fereastra Google. Permite ferestrele pop-up și încearcă din nou.";

      case "auth/operation-not-allowed":
        return "Această metodă de autentificare nu este activată încă în Firebase.";

      case "auth/account-exists-with-different-credential":
        return "Există deja un cont cu acest email folosind altă metodă de autentificare.";

      default:
        return "Autentificarea nu a reușit. Încearcă din nou.";

    }

  }

</script>

</body>
</html>
