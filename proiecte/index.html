<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proiecte | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b12;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.menu-open {
      overflow: hidden;
    }

    nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8%;
      border-bottom: 1px solid #1d2330;
      background: rgba(8, 11, 18, 0.92);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .menu-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111722;
      color: white;
      border: 1px solid #293142;
      border-radius: 11px;
      font-size: 22px;
      cursor: pointer;
      transition: .2s;
    }

    .menu-button:hover {
      border-color: #5b8cff;
      background: #161e2b;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    #loggedOut,
    #loggedIn {
      display: none;
    }

    .login-button,
    .user-button,
    .logout-button {
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: .2s;
    }

    .login-button {
      background: #5b8cff;
      color: white;
      border: 1px solid #5b8cff;
      font-weight: 700;
    }

    .user-button {
      background: transparent;
      color: #cbd4e4;
      border: 1px solid #293142;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-button:hover {
      color: white;
      border-color: #5b8cff;
    }

    .logout-button {
      background: #161c27;
      color: white;
      border: 1px solid #293142;
    }

    .logout-button:hover {
      border-color: #5b8cff;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .58);
      z-index: 199;
      opacity: 0;
      visibility: hidden;
      transition: .25s;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .side-menu {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 320px;
      max-width: 86vw;
      background: #0c111a;
      border-right: 1px solid #222a39;
      z-index: 200;
      padding: 20px;
      transform: translateX(-105%);
      transition: transform .25s ease;
      overflow-y: auto;
    }

    .side-menu.open {
      transform: translateX(0);
    }

    .menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .menu-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
    }

    .menu-brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
    }

    .menu-brand span {
      color: #5b8cff;
    }

    .menu-close {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 1px solid #293142;
      background: #131a26;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .menu-links {
      display: grid;
      gap: 7px;
    }

    .menu-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #aab5c7;
      text-decoration: none;
      padding: 13px 14px;
      border-radius: 10px;
      transition: .2s;
    }

    .menu-link:hover {
      background: #151c28;
      color: white;
    }

    .menu-link.active {
      color: white;
      background: rgba(91, 140, 255, .13);
      border: 1px solid rgba(91, 140, 255, .25);
    }

    .menu-separator {
      height: 1px;
      background: #202735;
      margin: 12px 0;
    }

    main {
      flex: 1;
      width: min(1100px, 90%);
      margin: auto;
      padding: 80px 0;
    }

    .back {
      color: #71809a;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    h1 {
      font-size: clamp(48px, 7vw, 72px);
      letter-spacing: -3px;
      margin-top: 25px;
    }

    h1 span {
      color: #5b8cff;
    }

    #projectsList {
      margin-top: 45px;
      display: grid;
      gap: 16px;
    }

    .project-card {
      background: #0e131d;
      border: 1px solid #202735;
      border-radius: 18px;
      padding: 22px;
      transition: .2s;
    }

    .project-card:hover {
      border-color: #303b50;
      transform: translateY(-2px);
    }

    .project-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .project-description {
      color: #7f899a;
      font-size: 14px;
      line-height: 1.5;
    }

    .resources {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 17px;
    }

    .resource-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #151c28;
      border: 1px solid #293243;
      color: #d9e2f1;
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      transition: .2s;
      max-width: 100%;
    }

    .resource-button:hover {
      background: #1b2534;
      border-color: #5b8cff;
      color: white;
    }

    .resource-button.file {
      background: #5b8cff;
      border-color: #5b8cff;
      color: white;
    }

    .resource-button.file:hover {
      background: #6c98ff;
    }

    .no-resource {
      margin-top: 15px;
      color: #5f6b7e;
      font-size: 13px;
    }

    .empty {
      min-height: 250px;
      border: 1px dashed #293243;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 18px;
    }

    .empty h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .empty p {
      color: #657188;
      font-size: 14px;
    }

    footer {
      border-top: 1px solid #1d2330;
      padding: 30px 8%;
      color: #626d7f;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 750px) {
      nav {
        padding: 0 5%;
      }

      main {
        padding-top: 55px;
      }

      footer {
        flex-direction: column;
        gap: 10px;
      }

      .user-button {
        max-width: 135px;
      }

      .login-button,
      .user-button,
      .logout-button {
        padding: 8px 11px;
      }

      .side-menu {
        width: 300px;
      }

      .resources {
        display: grid;
      }

      .resource-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<nav>
  <button
    id="menuButton"
    class="menu-button"
    type="button"
    aria-label="Deschide meniul"
  >
    ☰
  </button>

  <div class="account">

    <div id="loggedOut">
      <a href="/login/" class="login-button">
        Login
      </a>
    </div>

    <div id="loggedIn" class="account">

      <a id="userButton" href="/cont/" class="user-button">
        Cont
      </a>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>
</nav>


<div id="menuOverlay" class="menu-overlay"></div>

<aside id="sideMenu" class="side-menu">

  <div class="menu-head">

    <div class="menu-brand">
      <img src="/logo.png" alt="">
      Vlad<span>Lab</span>
    </div>

    <button
      id="menuClose"
      class="menu-close"
      type="button"
      aria-label="Închide meniul"
    >
      ×
    </button>

  </div>

  <div class="menu-links">

    <a class="menu-link" href="/">
      🏠 Acasă
    </a>

    <a class="menu-link" href="/scoala/">
      🎓 Școală
    </a>

    <a class="menu-link active" href="/proiecte/">
      💻 Proiecte
    </a>

    <a class="menu-link" href="/upload/">
      📤 Trimite fișier
    </a>

    <a class="menu-link" href="/download/">
      📥 Descărcări
    </a>

    <a class="menu-link" href="/favorite/">
      ❤️ Favorite
    </a>

    <div class="menu-separator"></div>

    <a
      class="menu-link"
      href="http://novasmp.space/"
      target="_blank"
      rel="noopener noreferrer"
    >
      ⛏️ Nova SMP
    </a>

  </div>

</aside>


<main>

  <a href="/" class="back">
    ← Înapoi la VladLab
  </a>

  <h1>
    💻 <span>Proiecte</span>
  </h1>

  <div id="projectsList">

    <div class="empty">
      <div class="empty-icon">⏳</div>

      <h2>Se încarcă...</h2>

      <p>
        Se verifică proiectele disponibile.
      </p>
    </div>

  </div>

</main>


<footer>

  <div>
    © 2026 VladLab
  </div>

  <div>
    Proiecte
  </div>

</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",
    authDomain: "vladlab-11887.firebaseapp.com",
    projectId: "vladlab-11887",
    storageBucket: "vladlab-11887.firebasestorage.app",
    messagingSenderId: "741561223788",
    appId: "1:741561223788:web:88ad3e62db87e32551a649",
    measurementId: "G-9XN16BVYRN"
  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  const loggedOut =
    document.getElementById("loggedOut");

  const loggedIn =
    document.getElementById("loggedIn");

  const userButton =
    document.getElementById("userButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const projectsList =
    document.getElementById("projectsList");


  /* =========================
     MENIU
  ========================= */

  const menuButton =
    document.getElementById("menuButton");

  const menuClose =
    document.getElementById("menuClose");

  const sideMenu =
    document.getElementById("sideMenu");

  const menuOverlay =
    document.getElementById("menuOverlay");


  function openMenu() {
    sideMenu.classList.add("open");
    menuOverlay.classList.add("open");
    document.body.classList.add("menu-open");
  }


  function closeMenu() {
    sideMenu.classList.remove("open");
    menuOverlay.classList.remove("open");
    document.body.classList.remove("menu-open");
  }


  menuButton.addEventListener("click", openMenu);
  menuClose.addEventListener("click", closeMenu);
  menuOverlay.addEventListener("click", closeMenu);


  document
    .querySelectorAll(".menu-link")
    .forEach(link => {
      link.addEventListener("click", closeMenu);
    });


  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      closeMenu();
    }
  });


  /* =========================
     LOGIN
  ========================= */

  onAuthStateChanged(auth, user => {

    if (!user) {

      loggedIn.style.display = "none";
      loggedOut.style.display = "block";
      return;
    }


    loggedOut.style.display = "none";
    loggedIn.style.display = "flex";


    if (user.uid === ADMIN_UID) {

      userButton.textContent = "Vlad";
      userButton.href = "/admin/";

    } else {

      userButton.textContent =
        user.displayName ||
        user.email?.split("@")[0] ||
        "Cont";

      userButton.href = "/cont/";

    }

  });


  logoutButton.addEventListener(
    "click",
    async () => {

      try {
        await signOut(auth);
        window.location.href = "/";
      } catch (error) {
        console.error(error);
      }

    }
  );


  /* =========================
     VALIDARE URL
  ========================= */

  function safeUrl(value) {

    try {

      const parsed =
        new URL(value);

      if (
        parsed.protocol === "https:" ||
        parsed.protocol === "http:"
      ) {
        return parsed.href;
      }

    } catch {}

    return null;
  }


  /* =========================
     PROIECTE
  ========================= */

  const projectsQuery =
    query(
      collection(db, "projects"),
      orderBy("createdAt", "desc")
    );


  onSnapshot(
    projectsQuery,

    snapshot => {

      projectsList.innerHTML = "";


      if (snapshot.empty) {

        projectsList.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🛠️</div>

            <h2>
              Momentan nu există proiecte.
            </h2>

            <p>
              Proiectele vor apărea aici.
            </p>
          </div>
        `;

        return;
      }


      snapshot.forEach(documentSnapshot => {

        const data =
          documentSnapshot.data();


        const card =
          document.createElement("div");

        card.className =
          "project-card";


        const title =
          document.createElement("div");

        title.className =
          "project-title";

        title.textContent =
          data.title || "Proiect";


        card.appendChild(title);


        if (data.description) {

          const description =
            document.createElement("div");

          description.className =
            "project-description";

          description.textContent =
            data.description;

          card.appendChild(description);

        }


        let resources =
          Array.isArray(data.resources)
            ? data.resources
            : [];


        /* PROIECT VECHI */

        if (
          resources.length === 0 &&
          data.url
        ) {

          resources = [{
            type: "link",
            name: "Deschide",
            url: data.url
          }];

        }


        const validResources =
          resources.filter(resource =>
            resource &&
            safeUrl(resource.url)
          );


        if (validResources.length) {

          const resourcesBox =
            document.createElement("div");

          resourcesBox.className =
            "resources";


          validResources.forEach(
            (resource, index) => {

              const url =
                safeUrl(resource.url);


              const button =
                document.createElement("a");

              button.className =
                "resource-button";


              if (resource.type === "file") {
                button.classList.add("file");
              }


              button.href = url;

              button.target = "_blank";

              button.rel =
                "noopener noreferrer";


              if (resource.type === "file") {

                button.textContent =
                  "📄 " +
                  (
                    resource.name ||
                    `Fișier ${index + 1}`
                  );

              } else {

                const name =
                  resource.name &&
                  resource.name !== resource.url
                    ? resource.name
                    : `Link ${index + 1}`;


                button.textContent =
                  "🔗 " + name;

              }


              resourcesBox.appendChild(
                button
              );

            }
          );


          card.appendChild(resourcesBox);

        } else {

          const noResource =
            document.createElement("div");

          noResource.className =
            "no-resource";

          noResource.textContent =
            "Acest proiect nu are încă fișiere sau linkuri.";

          card.appendChild(noResource);

        }


        projectsList.appendChild(card);

      });

    },

    error => {

      console.error(error);

      projectsList.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          <h2>
            Nu am putut încărca proiectele.
          </h2>

          <p>
            Încearcă din nou mai târziu.
          </p>

        </div>
      `;

    }
  );

</script>

</body>
</html>
