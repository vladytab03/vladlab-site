<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proiecte | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      height: 72px;
      border-bottom: 1px solid #1d2330;
      background: rgba(8, 11, 18, 0.94);
      backdrop-filter: blur(15px);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      color: white;
      text-decoration: none;

      font-size: 20px;
      font-weight: 700;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      object-fit: cover;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #loggedOut,
    #loggedIn {
      display: none;
    }

    .login-button,
    .user-button,
    .logout-button {
      border-radius: 10px;
      padding: 9px 15px;

      font-size: 14px;
      text-decoration: none;

      cursor: pointer;
      transition: 0.2s;
    }

    .login-button {
      background: #5b8cff;
      color: white;
      border: 1px solid #5b8cff;
      font-weight: 700;
    }

    .login-button:hover {
      background: #6c98ff;
    }

    .user-button {
      background: transparent;
      color: #cbd4e4;
      border: 1px solid #293142;
    }

    .user-button:hover {
      color: white;
      border-color: #5b8cff;
    }

    .logout-button {
      background: #161c27;
      color: white;
      border: 1px solid #293142;
    }

    .logout-button:hover {
      border-color: #5b8cff;
      background: #1a2230;
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 70px 25px 90px;
      min-height: calc(100vh - 150px);
    }

    .badge {
      display: inline-block;

      background: rgba(91, 140, 255, 0.12);
      color: #7ca2ff;

      border: 1px solid rgba(91, 140, 255, 0.25);
      border-radius: 100px;

      padding: 7px 12px;

      font-size: 12px;
      font-weight: 700;

      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 60px);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #8995a9;
      line-height: 1.6;
      margin-bottom: 45px;
    }

    .empty {
      background: #0e131d;
      border: 1px solid #202735;
      border-radius: 18px;

      padding: 45px 30px;

      text-align: center;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 18px;
    }

    .empty h2 {
      font-size: 20px;
      margin-bottom: 9px;
    }

    .empty p {
      color: #7f8a9e;
      font-size: 14px;
    }

    footer {
      max-width: 1150px;
      margin: auto;

      padding: 30px 25px 45px;

      border-top: 1px solid #171d28;

      color: #596477;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      nav {
        padding: 0 18px;
      }

      main {
        padding-top: 45px;
      }

      .login-button,
      .user-button,
      .logout-button {
        padding: 8px 11px;
      }
    }
  </style>
</head>

<body>

<nav>

  <a href="/" class="brand">
    <img src="/logo.png" alt="VladLab">
    VladLab
  </a>

  <div class="account">

    <div id="loggedOut">

      <a href="/login/" class="login-button">
        Login
      </a>

    </div>

    <div id="loggedIn" class="account">

      <a href="/admin/" class="user-button">
        Vlad
      </a>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</nav>


<main>

  <div class="badge">
    VLADLAB
  </div>

  <h1>
    💻 Proiecte
  </h1>

  <p class="subtitle">
    Proiecte și lucruri create în VladLab.
  </p>


  <div class="empty">

    <div class="empty-icon">
      💻
    </div>

    <h2>
      Momentan nu există proiecte
    </h2>

    <p>
      Proiectele publicate vor apărea aici.
    </p>

  </div>

</main>


<footer>
  © 2026 VladLab • Proiecte
</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",
    authDomain: "vladlab-11887.firebaseapp.com",
    projectId: "vladlab-11887",
    storageBucket: "vladlab-11887.firebasestorage.app",
    messagingSenderId: "741561223788",
    appId: "1:741561223788:web:88ad3e62db87e32551a649",
    measurementId: "G-9XN16BVYRN"
  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);


  const loggedOut =
    document.getElementById("loggedOut");

  const loggedIn =
    document.getElementById("loggedIn");

  const logoutButton =
    document.getElementById("logoutButton");


  onAuthStateChanged(auth, (user) => {

    if (user && user.uid === ADMIN_UID) {

      loggedOut.style.display = "none";
      loggedIn.style.display = "flex";

    } else {

      loggedIn.style.display = "none";
      loggedOut.style.display = "block";

    }

  });


  logoutButton.addEventListener(
    "click",

    async () => {

      await signOut(auth);

      window.location.reload();

    }

  );

</script>

</body>
</html>
