<!DOCTYPE html>
<html lang="ro">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proiecte | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b12;
      color: white;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    nav {
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 8%;

      border-bottom: 1px solid #1d2330;

      background: rgba(8, 11, 18, 0.92);

      position: sticky;
      top: 0;
      z-index: 10;

      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;

      text-decoration: none;
      color: white;
    }

    .logo img {
      width: 44px;
      height: 44px;

      border-radius: 11px;

      object-fit: cover;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo-text span {
      color: #5b8cff;
    }


    /* LOGIN / USER */

    .account {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #loggedOut,
    #loggedIn {
      display: none;
    }

    .login-button,
    .user-button,
    .logout-button {
      border-radius: 10px;

      padding: 9px 15px;

      font-size: 14px;

      text-decoration: none;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-button {
      background: #5b8cff;

      color: white;

      border: 1px solid #5b8cff;

      font-weight: 700;
    }

    .login-button:hover {
      background: #6c98ff;
    }

    .user-button {
      background: transparent;

      color: #cbd4e4;

      border: 1px solid #293142;
    }

    .user-button:hover {
      color: white;

      border-color: #5b8cff;
    }

    .logout-button {
      background: #161c27;

      color: white;

      border: 1px solid #293142;
    }

    .logout-button:hover {
      border-color: #5b8cff;

      background: #1a2230;
    }


    /* MAIN */

    main {
      flex: 1;

      width: min(1100px, 90%);

      margin: auto;

      padding: 80px 0;
    }

    .back {
      color: #71809a;

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    h1 {
      font-size: clamp(48px, 7vw, 72px);

      letter-spacing: -3px;

      margin-top: 25px;
    }

    h1 span {
      color: #5b8cff;
    }


    /* PROJECTS */

    #projectsList {
      margin-top: 45px;

      display: grid;

      gap: 16px;
    }

    .project-card {
      background: #0e131d;

      border: 1px solid #202735;

      border-radius: 18px;

      padding: 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 25px;

      transition: 0.2s;
    }

    .project-card:hover {
      border-color: #303b50;

      transform: translateY(-2px);
    }

    .project-info {
      min-width: 0;
    }

    .project-title {
      font-size: 18px;

      font-weight: 700;

      margin-bottom: 7px;
    }

    .project-description {
      color: #7f899a;

      font-size: 14px;

      line-height: 1.5;
    }

    .project-button {
      flex-shrink: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: #5b8cff;

      color: white;

      text-decoration: none;

      border-radius: 10px;

      padding: 11px 17px;

      font-size: 14px;

      font-weight: 700;

      transition: 0.2s;
    }

    .project-button:hover {
      background: #6c98ff;
    }


    /* EMPTY */

    .empty {
      min-height: 250px;

      border: 1px dashed #293243;

      border-radius: 18px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;
    }

    .empty-icon {
      font-size: 38px;

      margin-bottom: 18px;
    }

    .empty h2 {
      font-size: 19px;

      margin-bottom: 8px;
    }

    .empty p {
      color: #657188;

      font-size: 14px;
    }


    /* FOOTER */

    footer {
      border-top: 1px solid #1d2330;

      padding: 30px 8%;

      color: #626d7f;

      font-size: 13px;

      display: flex;

      justify-content: space-between;
    }


    /* MOBILE */

    @media (max-width: 750px) {

      nav {
        padding: 0 5%;
      }

      main {
        padding-top: 55px;
      }

      footer {
        flex-direction: column;

        gap: 10px;
      }

      .login-button,
      .user-button,
      .logout-button {
        padding: 8px 11px;
      }

      .project-card {
        flex-direction: column;

        align-items: stretch;
      }

      .project-button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<nav>

  <a href="/" class="logo">

    <img src="/logo.png" alt="VladLab">

    <div class="logo-text">
      Vlad<span>Lab</span>
    </div>

  </a>


  <div class="account">

    <div id="loggedOut">

      <a href="/login/" class="login-button">
        Login
      </a>

    </div>


    <div id="loggedIn" class="account">

      <a href="/admin/" class="user-button">
        Vlad
      </a>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</nav>


<main>

  <a href="/" class="back">
    ← Înapoi la VladLab
  </a>

  <h1>
    💻 <span>Proiecte</span>
  </h1>


  <div id="projectsList">

    <div class="empty">

      <div class="empty-icon">
        ⏳
      </div>

      <h2>
        Se încarcă...
      </h2>

      <p>
        Se verifică proiectele disponibile.
      </p>

    </div>

  </div>

</main>


<footer>

  <div>
    © 2026 VladLab
  </div>

  <div>
    Proiecte
  </div>

</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",

    authDomain:
      "vladlab-11887.firebaseapp.com",

    projectId:
      "vladlab-11887",

    storageBucket:
      "vladlab-11887.firebasestorage.app",

    messagingSenderId:
      "741561223788",

    appId:
      "1:741561223788:web:88ad3e62db87e32551a649",

    measurementId:
      "G-9XN16BVYRN"

  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const loggedOut =
    document.getElementById("loggedOut");

  const loggedIn =
    document.getElementById("loggedIn");

  const logoutButton =
    document.getElementById("logoutButton");

  const projectsList =
    document.getElementById("projectsList");


  /* =========================
     LOGIN / LOGOUT
  ========================= */

  onAuthStateChanged(auth, (user) => {

    if (
      user &&
      user.uid === ADMIN_UID
    ) {

      loggedOut.style.display =
        "none";

      loggedIn.style.display =
        "flex";

    } else {

      loggedIn.style.display =
        "none";

      loggedOut.style.display =
        "block";

    }

  });


  logoutButton.addEventListener(
    "click",

    async () => {

      await signOut(auth);

      window.location.reload();

    }

  );


  /* =========================
     PROIECTE DIN FIRESTORE
  ========================= */

  const projectsQuery =
    query(
      collection(db, "projects"),
      orderBy("createdAt", "desc")
    );


  onSnapshot(

    projectsQuery,

    (snapshot) => {

      projectsList.innerHTML = "";


      /* NICIUN PROIECT */

      if (snapshot.empty) {

        projectsList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              🛠️
            </div>

            <h2>
              Momentan nu există proiecte.
            </h2>

            <p>
              Proiectele vor apărea aici.
            </p>

          </div>
        `;

        return;

      }


      /* AFIȘARE PROIECTE */

      snapshot.forEach((documentSnapshot) => {

        const data =
          documentSnapshot.data();


        const card =
          document.createElement("div");

        card.className =
          "project-card";


        const info =
          document.createElement("div");

        info.className =
          "project-info";


        const title =
          document.createElement("div");

        title.className =
          "project-title";

        title.textContent =
          data.title || "Proiect";


        info.appendChild(title);


        if (data.description) {

          const description =
            document.createElement("div");

          description.className =
            "project-description";

          description.textContent =
            data.description;

          info.appendChild(description);

        }


        const button =
          document.createElement("a");

        button.className =
          "project-button";

        button.textContent =
          "Deschide";


        /* VERIFICARE LINK */

        try {

          const projectUrl =
            new URL(data.url);

          if (
            projectUrl.protocol === "https:" ||
            projectUrl.protocol === "http:"
          ) {

            button.href =
              projectUrl.href;

            button.target =
              "_blank";

            button.rel =
              "noopener noreferrer";

          } else {

            button.removeAttribute("href");

            button.textContent =
              "Link indisponibil";

          }

        } catch {

          button.removeAttribute("href");

          button.textContent =
            "Link indisponibil";

        }


        card.appendChild(info);

        card.appendChild(button);

        projectsList.appendChild(card);

      });

    },


    (error) => {

      console.error(error);

      projectsList.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          <h2>
            Nu am putut încărca proiectele.
          </h2>

          <p>
            Încearcă din nou mai târziu.
          </p>

        </div>
      `;

    }

  );

</script>


</body>

</html>
