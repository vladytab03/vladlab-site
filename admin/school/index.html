<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Școală | VladLab Admin</title>

  <link rel="icon" href="/logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      height: 72px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1d2330;
      background: rgba(8, 11, 18, .94);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: #fff;
    }

    .logo img {
      width: 44px;
      height: 44px;
      border-radius: 11px;
    }

    .logo-text {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo-text span {
      color: #5b8cff;
    }

    .admin {
      padding: 6px 10px;
      border: 1px solid #293142;
      border-radius: 8px;
      color: #8d9ab0;
      font-size: 12px;
    }

    main {
      width: min(1000px, 90%);
      margin: auto;
      padding: 55px 0 80px;
    }

    .back {
      color: #71809a;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    h1 {
      margin-top: 25px;
      font-size: 42px;
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 8px;
      color: #7f899a;
      line-height: 1.5;
    }

    .panel {
      margin-top: 35px;
      padding: 26px;
      background: #0e131d;
      border: 1px solid #202735;
      border-radius: 18px;
    }

    .panel h2 {
      margin-bottom: 22px;
      font-size: 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #b9c2d1;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      background: #090d15;
      border: 1px solid #293243;
      border-radius: 10px;
      color: #fff;
      font: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #5b8cff;
      box-shadow: 0 0 0 3px rgba(91,140,255,.1);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 11px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      padding: 9px 12px;
      margin-right: 12px;
      border: 1px solid #303a4e;
      border-radius: 8px;
      background: #151c29;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button:hover {
      background: #1c2535;
    }

    .file-note {
      margin-top: 7px;
      color: #657188;
      font-size: 12px;
    }

    .primary {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #5b8cff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .primary:hover {
      background: #6c98ff;
    }

    .primary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .section-title {
      margin: 45px 0 18px;
      font-size: 21px;
    }

    #materials {
      display: grid;
      gap: 13px;
    }

    .material {
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: #0e131d;
      border: 1px solid #202735;
      border-radius: 14px;
    }

    .material-info {
      min-width: 0;
    }

    .material-title {
      margin-bottom: 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .material-description {
      margin-bottom: 7px;
      color: #7f899a;
      font-size: 13px;
      line-height: 1.4;
    }

    .material-link {
      display: block;
      max-width: 650px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #5b8cff;
      font-size: 12px;
      text-decoration: none;
    }

    .material-link:hover {
      text-decoration: underline;
    }

    .delete {
      flex-shrink: 0;
      padding: 9px 13px;
      background: rgba(255,77,77,.08);
      border: 1px solid rgba(255,77,77,.22);
      border-radius: 9px;
      color: #ff8b8b;
      font-weight: 600;
      cursor: pointer;
    }

    .delete:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty {
      padding: 40px 20px;
      border: 1px dashed #293243;
      border-radius: 14px;
      color: #657188;
      text-align: center;
    }

    #status {
      display: none;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
    }

    #status.ok {
      display: block;
      color: #75e4a4;
      background: rgba(67,211,126,.08);
      border: 1px solid rgba(67,211,126,.2);
    }

    #status.error {
      display: block;
      color: #ff9292;
      background: rgba(255,80,80,.08);
      border: 1px solid rgba(255,80,80,.2);
    }

    footer {
      padding: 28px;
      border-top: 1px solid #1d2330;
      color: #626d7f;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .material {
        flex-direction: column;
        align-items: stretch;
      }

      .delete {
        width: 100%;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<nav>
  <a href="/admin/" class="logo">
    <img src="/logo.png" alt="VladLab">
    <div class="logo-text">Vlad<span>Lab</span></div>
  </a>

  <div class="admin">ADMIN</div>
</nav>

<main>

  <a class="back" href="/admin/">
    ← Înapoi la Admin Panel
  </a>

  <h1>🎓 Școală</h1>

  <p class="subtitle">
    Încarcă și gestionează materialele afișate pe pagina Școală.
  </p>


  <div class="panel">

    <h2>Adaugă material</h2>

    <form id="form">

      <div class="field">
        <label for="title">Titlu</label>

        <input
          id="title"
          type="text"
          placeholder="Ex: Fișă matematică"
          required
        >
      </div>

      <div class="field">
        <label for="description">Descriere</label>

        <textarea
          id="description"
          placeholder="Descriere opțională..."
        ></textarea>
      </div>

      <div class="field">
        <label for="file">Fișier</label>

        <input
          id="file"
          type="file"
          required
        >

        <div class="file-note">
          Alege materialul direct de pe calculator.
        </div>
      </div>

      <button
        id="addButton"
        class="primary"
        type="submit"
      >
        ⬆ Încarcă material
      </button>

    </form>

    <div id="status"></div>

  </div>


  <h2 class="section-title">
    Materiale
  </h2>

  <div id="materials">
    <div class="empty">Se încarcă...</div>
  </div>

</main>


<footer>
  © 2026 VladLab · Admin Panel
</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    serverTimestamp,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",
    authDomain: "vladlab-11887.firebaseapp.com",
    projectId: "vladlab-11887",
    storageBucket: "vladlab-11887.firebasestorage.app",
    messagingSenderId: "741561223788",
    appId: "1:741561223788:web:88ad3e62db87e32551a649",
    measurementId: "G-9XN16BVYRN"
  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbycRg6W15NRwev2sNSr6lnTw8Lq9LVgwAIdUGrQxasXAQtl3jy7xuLbLI-rH109g9UQ9g/exec";


  const MAX_FILE_SIZE =
    10 * 1024 * 1024;


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  const form =
    document.getElementById("form");

  const addButton =
    document.getElementById("addButton");

  const materials =
    document.getElementById("materials");

  const status =
    document.getElementById("status");

  const fileInput =
    document.getElementById("file");


  let ready = false;


  /* =========================
     VERIFICARE ADMIN
  ========================= */

  onAuthStateChanged(auth, user => {

    if (!user) {
      location.href = "/login/";
      return;
    }

    if (user.uid !== ADMIN_UID) {
      location.href = "/";
      return;
    }

    ready = true;
    loadMaterials();

  });


  /* =========================
     FIȘIER -> BASE64
  ========================= */

  function fileToBase64(file) {

    return new Promise((resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const result =
          String(reader.result || "");

        const commaIndex =
          result.indexOf(",");


        if (commaIndex === -1) {

          reject(
            new Error(
              "Fișierul nu a putut fi citit."
            )
          );

          return;
        }


        resolve(
          result.substring(commaIndex + 1)
        );

      };


      reader.onerror = () => {

        reject(
          new Error(
            "Fișierul nu a putut fi citit."
          )
        );

      };


      reader.readAsDataURL(file);

    });

  }


  /* =========================
     UPLOAD DRIVE
  ========================= */

  async function uploadToDrive(file) {

    const fileData =
      await fileToBase64(file);


    const payload = {

      name: "VladLab Admin",

      message:
        "Fișier adăugat din Admin → Școală",

      fileName:
        file.name,

      mimeType:
        file.type ||
        "application/octet-stream",

      fileData:
        fileData

    };


    const response =
      await fetch(
        SCRIPT_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(payload)
        }
      );


    if (!response.ok) {

      throw new Error(
        "Uploadul nu a reușit."
      );

    }


    const result =
      await response.json();


    if (
      !result.success ||
      !result.fileId
    ) {

      throw new Error(
        result.message ||
        "Uploadul nu a reușit."
      );

    }


    return {
      fileId:
        result.fileId,

      fileName:
        result.fileName ||
        file.name,

      url:
        result.downloadUrl ||
        result.fileUrl
    };

  }


  /* =========================
     ADAUGĂ MATERIAL
  ========================= */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      if (!ready) return;


      const title =
        document
          .getElementById("title")
          .value
          .trim();


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const file =
        fileInput.files[0];


      if (!title || !file) {

        showStatus(
          "Completează titlul și alege un fișier.",
          "error"
        );

        return;
      }


      if (file.size > MAX_FILE_SIZE) {

        showStatus(
          "Fișierul este prea mare. Maxim 10 MB.",
          "error"
        );

        return;
      }


      addButton.disabled = true;

      addButton.textContent =
        "Se încarcă în Drive...";


      try {

        const uploaded =
          await uploadToDrive(file);


        addButton.textContent =
          "Se salvează...";


        await addDoc(
          collection(
            db,
            "schoolMaterials"
          ),
          {
            title: title,
            description: description,
            url: uploaded.url,
            driveFileId:
              uploaded.fileId,
            fileName:
              uploaded.fileName,
            createdAt:
              serverTimestamp()
          }
        );


        form.reset();


        showStatus(
          "Materialul a fost încărcat și adăugat.",
          "ok"
        );

      }

      catch (error) {

        console.error(error);


        showStatus(
          "Nu am putut încărca materialul.",
          "error"
        );

      }

      finally {

        addButton.disabled = false;

        addButton.textContent =
          "⬆ Încarcă material";

      }

    }
  );


  /* =========================
     ÎNCARCĂ LISTA
  ========================= */

  function loadMaterials() {

    const q =
      query(
        collection(
          db,
          "schoolMaterials"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    onSnapshot(
      q,

      snapshot => {

        materials.innerHTML = "";


        if (snapshot.empty) {

          materials.innerHTML =
            '<div class="empty">Momentan nu există materiale adăugate din Admin.</div>';

          return;
        }


        snapshot.forEach(item => {

          const data =
            item.data();


          const card =
            document.createElement("div");

          card.className =
            "material";


          const info =
            document.createElement("div");

          info.className =
            "material-info";


          const title =
            document.createElement("div");

          title.className =
            "material-title";

          title.textContent =
            data.title ||
            "Fără titlu";


          const description =
            document.createElement("div");

          description.className =
            "material-description";

          description.textContent =
            data.description || "";


          const link =
            document.createElement("a");

          link.className =
            "material-link";

          link.href =
            data.url || "#";

          link.target =
            "_blank";

          link.rel =
            "noopener noreferrer";

          link.textContent =
            data.fileName ||
            data.url ||
            "Deschide materialul";


          info.appendChild(title);


          if (data.description) {

            info.appendChild(
              description
            );

          }


          info.appendChild(link);


          const remove =
            document.createElement(
              "button"
            );

          remove.className =
            "delete";

          remove.type =
            "button";

          remove.textContent =
            "Șterge";


          remove.onclick =
            async () => {

              if (
                !confirm(
                  `Ștergi „${
                    data.title ||
                    "materialul"
                  }”?`
                )
              ) {
                return;
              }


              remove.disabled = true;

              remove.textContent =
                "Se șterge...";


              try {

                await deleteDoc(
                  doc(
                    db,
                    "schoolMaterials",
                    item.id
                  )
                );

              }

              catch (error) {

                console.error(error);


                alert(
                  "Materialul nu a putut fi șters."
                );


                remove.disabled = false;

                remove.textContent =
                  "Șterge";

              }

            };


          card.appendChild(info);

          card.appendChild(remove);

          materials.appendChild(card);

        });

      },

      error => {

        console.error(error);

        materials.innerHTML =
          '<div class="empty">Nu am putut încărca materialele.</div>';

      }
    );

  }


  /* =========================
     STATUS
  ========================= */

  function showStatus(text, type) {

    status.className = type;

    status.textContent = text;


    setTimeout(() => {

      status.className = "";

      status.textContent = "";

    }, 5000);

  }

</script>

</body>
</html>
