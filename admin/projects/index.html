<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proiecte | VladLab Admin</title>
  <link rel="icon" href="/logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      height: 72px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1d2330;
      background: rgba(8, 11, 18, .94);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: white;
    }

    .logo img {
      width: 44px;
      height: 44px;
      border-radius: 11px;
    }

    .logo-text {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo-text span {
      color: #5b8cff;
    }

    .admin {
      padding: 6px 10px;
      border: 1px solid #293142;
      border-radius: 8px;
      color: #8d9ab0;
      font-size: 12px;
    }

    main {
      width: min(1000px, 90%);
      margin: auto;
      padding: 55px 0 80px;
    }

    .back {
      color: #71809a;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    h1 {
      margin-top: 25px;
      font-size: 42px;
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 8px;
      color: #7f899a;
      line-height: 1.5;
    }

    .panel {
      margin-top: 35px;
      padding: 26px;
      background: #0e131d;
      border: 1px solid #202735;
      border-radius: 18px;
    }

    .panel h2 {
      margin-bottom: 22px;
      font-size: 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #b9c2d1;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      background: #090d15;
      border: 1px solid #293243;
      border-radius: 10px;
      color: white;
      font: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #5b8cff;
      box-shadow: 0 0 0 3px rgba(91, 140, 255, .1);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 11px;
    }

    input[type="file"]::file-selector-button {
      padding: 9px 12px;
      margin-right: 12px;
      border: 1px solid #303a4e;
      border-radius: 8px;
      background: #151c29;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .note {
      margin-top: 7px;
      color: #657188;
      font-size: 12px;
      line-height: 1.5;
    }

    .links-box {
      display: grid;
      gap: 10px;
    }

    .link-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
    }

    .small-button {
      padding: 0 15px;
      border: 1px solid #303a4e;
      border-radius: 10px;
      background: #151c29;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .small-button:hover {
      background: #1c2535;
    }

    .remove-link {
      color: #ff9292;
    }

    .add-link-button {
      margin-top: 10px;
      padding: 10px 13px;
      border: 1px solid #303a4e;
      border-radius: 9px;
      background: transparent;
      color: #aebbd0;
      cursor: pointer;
      font-weight: 600;
    }

    .add-link-button:hover {
      color: white;
      background: #151c29;
    }

    .primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #5b8cff;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .primary:hover {
      background: #6c98ff;
    }

    .primary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .section-title {
      margin: 45px 0 18px;
      font-size: 21px;
    }

    #projects {
      display: grid;
      gap: 13px;
    }

    .project {
      padding: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      background: #0e131d;
      border: 1px solid #202735;
      border-radius: 14px;
    }

    .project-info {
      min-width: 0;
      flex: 1;
    }

    .project-title {
      margin-bottom: 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .project-description {
      margin-bottom: 10px;
      color: #7f899a;
      font-size: 13px;
      line-height: 1.4;
    }

    .resource-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .project-link {
      display: block;
      max-width: 650px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #5b8cff;
      font-size: 12px;
      text-decoration: none;
    }

    .project-link:hover {
      text-decoration: underline;
    }

    .resource-type {
      color: #657188;
    }

    .delete {
      flex-shrink: 0;
      padding: 9px 13px;
      background: rgba(255, 77, 77, .08);
      border: 1px solid rgba(255, 77, 77, .22);
      border-radius: 9px;
      color: #ff8b8b;
      font-weight: 600;
      cursor: pointer;
    }

    .delete:hover {
      background: rgba(255, 77, 77, .14);
    }

    .delete:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty {
      padding: 40px 20px;
      border: 1px dashed #293243;
      border-radius: 14px;
      color: #657188;
      text-align: center;
    }

    #status {
      display: none;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
    }

    #status.ok {
      display: block;
      color: #75e4a4;
      background: rgba(67, 211, 126, .08);
      border: 1px solid rgba(67, 211, 126, .2);
    }

    #status.error {
      display: block;
      color: #ff9292;
      background: rgba(255, 80, 80, .08);
      border: 1px solid rgba(255, 80, 80, .2);
    }

    footer {
      padding: 28px;
      border-top: 1px solid #1d2330;
      color: #626d7f;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .project {
        flex-direction: column;
        align-items: stretch;
      }

      .delete {
        width: 100%;
      }

      h1 {
        font-size: 34px;
      }

      .link-row {
        grid-template-columns: 1fr;
      }

      .small-button {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<nav>
  <a href="/admin/" class="logo">
    <img src="/logo.png" alt="VladLab">
    <div class="logo-text">Vlad<span>Lab</span></div>
  </a>

  <div class="admin">ADMIN</div>
</nav>

<main>

  <a href="/admin/" class="back">
    ← Înapoi la Admin Panel
  </a>

  <h1>💻 Proiecte</h1>

  <p class="subtitle">
    Creează proiecte cu mai multe fișiere și linkuri.
  </p>

  <div class="panel">

    <h2>Adaugă proiect</h2>

    <form id="form">

      <div class="field">
        <label for="title">Nume proiect</label>

        <input
          id="title"
          type="text"
          placeholder="Ex: Nova SMP"
          required
        >
      </div>

      <div class="field">
        <label for="description">Descriere</label>

        <textarea
          id="description"
          placeholder="Descrierea proiectului..."
        ></textarea>
      </div>

      <div class="field">
        <label for="files">Fișiere</label>

        <input
          id="files"
          type="file"
          multiple
        >

        <div class="note">
          Poți selecta mai multe fișiere. Maxim 10 MB pentru fiecare fișier.
        </div>
      </div>

      <div class="field">

        <label>Linkuri externe</label>

        <div id="linksBox" class="links-box"></div>

        <button
          type="button"
          id="addLinkButton"
          class="add-link-button"
        >
          + Adaugă link
        </button>

        <div class="note">
          Linkurile sunt opționale. Poți adăuga mai multe.
        </div>

      </div>

      <button
        id="addButton"
        class="primary"
        type="submit"
      >
        + Creează proiect
      </button>

    </form>

    <div id="status"></div>

  </div>

  <h2 class="section-title">
    Proiecte existente
  </h2>

  <div id="projects">
    <div class="empty">Se încarcă...</div>
  </div>

</main>

<footer>
  © 2026 VladLab · Admin Panel
</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    serverTimestamp,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",
    authDomain: "vladlab-11887.firebaseapp.com",
    projectId: "vladlab-11887",
    storageBucket: "vladlab-11887.firebasestorage.app",
    messagingSenderId: "741561223788",
    appId: "1:741561223788:web:88ad3e62db87e32551a649",
    measurementId: "G-9XN16BVYRN"
  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbycRg6W15NRwev2sNSr6lnTw8Lq9LVgwAIdUGrQxasXAQtl3jy7xuLbLI-rH109g9UQ9g/exec";


  const MAX_FILE_SIZE =
    10 * 1024 * 1024;


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  const form =
    document.getElementById("form");

  const addButton =
    document.getElementById("addButton");

  const projects =
    document.getElementById("projects");

  const status =
    document.getElementById("status");

  const filesInput =
    document.getElementById("files");

  const linksBox =
    document.getElementById("linksBox");

  const addLinkButton =
    document.getElementById("addLinkButton");


  let ready = false;


  /* =========================
     ADMIN
  ========================= */

  onAuthStateChanged(auth, user => {

    if (!user) {
      location.href = "/login/";
      return;
    }

    if (user.uid !== ADMIN_UID) {
      location.href = "/";
      return;
    }

    ready = true;

    loadProjects();

  });


  /* =========================
     LINKURI
  ========================= */

  function addLinkRow() {

    const row =
      document.createElement("div");

    row.className = "link-row";


    const input =
      document.createElement("input");

    input.type = "url";

    input.className = "external-link";

    input.placeholder =
      "https://...";


    const remove =
      document.createElement("button");

    remove.type = "button";

    remove.className =
      "small-button remove-link";

    remove.textContent =
      "Elimină";


    remove.addEventListener(
      "click",
      () => {
        row.remove();
      }
    );


    row.appendChild(input);

    row.appendChild(remove);

    linksBox.appendChild(row);

  }


  addLinkButton.addEventListener(
    "click",
    addLinkRow
  );


  addLinkRow();


  /* =========================
     BASE64
  ========================= */

  function fileToBase64(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload = () => {

          const result =
            String(reader.result || "");

          const commaIndex =
            result.indexOf(",");


          if (commaIndex === -1) {

            reject(
              new Error(
                "Fișierul nu a putut fi citit."
              )
            );

            return;
          }


          resolve(
            result.substring(
              commaIndex + 1
            )
          );

        };


        reader.onerror = () => {

          reject(
            new Error(
              "Fișierul nu a putut fi citit."
            )
          );

        };


        reader.readAsDataURL(file);

      }
    );

  }


  /* =========================
     UPLOAD DRIVE
  ========================= */

  async function uploadToDrive(file) {

    const fileData =
      await fileToBase64(file);


    const response =
      await fetch(
        SCRIPT_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              name:
                "VladLab Admin",

              message:
                "Fișier proiect VladLab",

              fileName:
                file.name,

              mimeType:
                file.type ||
                "application/octet-stream",

              fileData:
                fileData
            })
        }
      );


    if (!response.ok) {

      throw new Error(
        "Uploadul nu a reușit."
      );

    }


    const result =
      await response.json();


    if (
      !result.success ||
      !result.fileId
    ) {

      throw new Error(
        result.message ||
        "Uploadul nu a reușit."
      );

    }


    return {
      type: "file",

      name:
        result.fileName ||
        file.name,

      url:
        result.downloadUrl ||
        result.fileUrl,

      driveFileId:
        result.fileId
    };

  }


  /* =========================
     CREEAZĂ PROIECT
  ========================= */

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      if (!ready) return;


      const title =
        document
          .getElementById("title")
          .value
          .trim();


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const selectedFiles =
        Array.from(
          filesInput.files
        );


      const linkInputs =
        Array.from(
          document.querySelectorAll(
            ".external-link"
          )
        );


      const externalLinks =
        linkInputs
          .map(input =>
            input.value.trim()
          )
          .filter(Boolean);


      if (!title) {

        showStatus(
          "Scrie numele proiectului.",
          "error"
        );

        return;
      }


      for (
        const file
        of selectedFiles
      ) {

        if (
          file.size >
          MAX_FILE_SIZE
        ) {

          showStatus(
            `Fișierul „${file.name}” depășește 10 MB.`,
            "error"
          );

          return;
        }

      }


      addButton.disabled = true;

      addButton.textContent =
        "Se pregătește...";


      try {

        const resources = [];


        for (
          let i = 0;
          i < selectedFiles.length;
          i++
        ) {

          const file =
            selectedFiles[i];


          addButton.textContent =
            `Se încarcă fișierul ${i + 1}/${selectedFiles.length}...`;


          const uploaded =
            await uploadToDrive(
              file
            );


          resources.push(
            uploaded
          );

        }


        externalLinks.forEach(
          url => {

            resources.push({
              type: "link",
              name: url,
              url: url
            });

          }
        );


        addButton.textContent =
          "Se salvează proiectul...";


        await addDoc(
          collection(
            db,
            "projects"
          ),
          {
            title: title,
            description:
              description,

            resources:
              resources,

            url:
              resources.length
                ? resources[0].url
                : "",

            createdAt:
              serverTimestamp()
          }
        );


        form.reset();

        linksBox.innerHTML = "";

        addLinkRow();


        showStatus(
          "Proiectul a fost adăugat.",
          "ok"
        );

      }

      catch (error) {

        console.error(error);


        showStatus(
          "Nu am putut crea proiectul.",
          "error"
        );

      }

      finally {

        addButton.disabled = false;

        addButton.textContent =
          "+ Creează proiect";

      }

    }
  );


  /* =========================
     LISTĂ PROIECTE
  ========================= */

  function loadProjects() {

    const projectsQuery =
      query(
        collection(
          db,
          "projects"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    onSnapshot(
      projectsQuery,

      snapshot => {

        projects.innerHTML = "";


        if (snapshot.empty) {

          projects.innerHTML =
            '<div class="empty">Momentan nu există proiecte adăugate din Admin.</div>';

          return;
        }


        snapshot.forEach(item => {

          const data =
            item.data();


          const card =
            document.createElement(
              "div"
            );

          card.className =
            "project";


          const info =
            document.createElement(
              "div"
            );

          info.className =
            "project-info";


          const title =
            document.createElement(
              "div"
            );

          title.className =
            "project-title";

          title.textContent =
            data.title ||
            "Fără titlu";


          info.appendChild(title);


          if (data.description) {

            const description =
              document.createElement(
                "div"
              );

            description.className =
              "project-description";

            description.textContent =
              data.description;

            info.appendChild(
              description
            );

          }


          let resources =
            Array.isArray(
              data.resources
            )
              ? data.resources
              : [];


          /* compatibilitate
             cu proiectele vechi */

          if (
            resources.length === 0 &&
            data.url
          ) {

            resources = [{
              type: "link",
              name: data.url,
              url: data.url
            }];

          }


          if (
            resources.length > 0
          ) {

            const list =
              document.createElement(
                "div"
              );

            list.className =
              "resource-list";


            resources.forEach(
              resource => {

                if (
                  !resource ||
                  !resource.url
                ) {
                  return;
                }


                const link =
                  document.createElement(
                    "a"
                  );

                link.className =
                  "project-link";

                link.href =
                  resource.url;

                link.target =
                  "_blank";

                link.rel =
                  "noopener noreferrer";


                const prefix =
                  resource.type ===
                  "file"
                    ? "📄 "
                    : "🔗 ";


                link.textContent =
                  prefix +
                  (
                    resource.name ||
                    resource.url
                  );


                list.appendChild(
                  link
                );

              }
            );


            info.appendChild(list);

          }


          const remove =
            document.createElement(
              "button"
            );

          remove.className =
            "delete";

          remove.type =
            "button";

          remove.textContent =
            "Șterge";


          remove.onclick =
            async () => {

              if (
                !confirm(
                  `Ștergi proiectul „${
                    data.title ||
                    "Fără titlu"
                  }”?`
                )
              ) {
                return;
              }


              remove.disabled = true;

              remove.textContent =
                "Se șterge...";


              try {

                await deleteDoc(
                  doc(
                    db,
                    "projects",
                    item.id
                  )
                );

              }

              catch (error) {

                console.error(error);

                alert(
                  "Nu am putut șterge proiectul."
                );

                remove.disabled = false;

                remove.textContent =
                  "Șterge";

              }

            };


          card.appendChild(info);

          card.appendChild(remove);

          projects.appendChild(card);

        });

      },

      error => {

        console.error(error);

        projects.innerHTML =
          '<div class="empty">Nu am putut încărca proiectele.</div>';

      }
    );

  }


  /* =========================
     STATUS
  ========================= */

  function showStatus(text, type) {

    status.className = type;

    status.textContent = text;


    setTimeout(() => {

      status.className = "";

      status.textContent = "";

    }, 5000);

  }

</script>

</body>
</html>
