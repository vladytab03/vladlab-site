<!DOCTYPE html>
<html lang="ro">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Upload | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b12;
      color: white;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }


    /* NAVBAR */

    nav {
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 8%;

      border-bottom: 1px solid #1d2330;

      background: rgba(8, 11, 18, 0.92);

      position: sticky;
      top: 0;
      z-index: 10;

      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;

      gap: 11px;

      text-decoration: none;

      color: white;
    }

    .logo img {
      width: 44px;
      height: 44px;

      border-radius: 11px;

      object-fit: cover;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 800;

      letter-spacing: -1px;
    }

    .logo-text span {
      color: #5b8cff;
    }


    /* LOGIN */

    .account {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    #loggedOut,
    #loggedIn {
      display: none;
    }

    .login-button,
    .user-button,
    .logout-button {
      border-radius: 10px;

      padding: 9px 15px;

      font-size: 14px;

      text-decoration: none;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-button {
      background: #5b8cff;

      color: white;

      border: 1px solid #5b8cff;

      font-weight: 700;
    }

    .login-button:hover {
      background: #6c98ff;
    }

    .user-button {
      background: transparent;

      color: #cbd4e4;

      border: 1px solid #293142;
    }

    .user-button:hover {
      color: white;

      border-color: #5b8cff;
    }

    .logout-button {
      background: #161c27;

      color: white;

      border: 1px solid #293142;
    }

    .logout-button:hover {
      background: #1a2230;

      border-color: #5b8cff;
    }


    /* MAIN */

    main {
      flex: 1;

      width: min(850px, 90%);

      margin: auto;

      padding: 80px 0;
    }

    .back {
      color: #71809a;

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    h1 {
      font-size: clamp(48px, 7vw, 72px);

      letter-spacing: -3px;

      margin-top: 25px;
    }

    h1 span {
      color: #5b8cff;
    }

    .subtitle {
      margin-top: 10px;

      color: #7f899a;

      font-size: 15px;
    }


    /* UPLOAD */

    .upload-box {
      margin-top: 45px;

      background: #0e131d;

      border: 1px solid #202735;

      border-radius: 20px;

      padding: 28px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;

      margin-bottom: 9px;

      color: #c7cfdd;

      font-size: 14px;

      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;

      padding: 14px 15px;

      background: #090d15;

      border: 1px solid #293243;

      border-radius: 11px;

      color: white;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 14px;

      outline: none;

      transition: 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: #5b8cff;

      box-shadow:
        0 0 0 3px rgba(91, 140, 255, 0.1);
    }

    textarea {
      min-height: 110px;

      resize: vertical;
    }

    input[type="file"] {
      cursor: pointer;
    }

    .hint {
      margin-top: 8px;

      color: #657188;

      font-size: 12px;
    }

    .send-button {
      width: 100%;

      padding: 14px 18px;

      border: none;

      border-radius: 11px;

      background: #5b8cff;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .send-button:hover {
      background: #6c98ff;
    }

    .send-button:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }


    /* STATUS */

    #status {
      display: none;

      margin-top: 20px;

      padding: 14px 16px;

      border-radius: 11px;

      font-size: 14px;
    }

    #status.loading {
      display: block;

      background: rgba(91, 140, 255, 0.08);

      border: 1px solid rgba(91, 140, 255, 0.22);

      color: #9bb7ff;
    }

    #status.success {
      display: block;

      background: rgba(58, 210, 120, 0.08);

      border: 1px solid rgba(58, 210, 120, 0.22);

      color: #72e7a4;
    }

    #status.error {
      display: block;

      background: rgba(255, 75, 75, 0.08);

      border: 1px solid rgba(255, 75, 75, 0.22);

      color: #ff9292;
    }


    /* FOOTER */

    footer {
      border-top: 1px solid #1d2330;

      padding: 30px 8%;

      color: #626d7f;

      font-size: 13px;

      display: flex;

      justify-content: space-between;
    }


    /* MOBILE */

    @media (max-width: 750px) {

      nav {
        padding: 0 5%;
      }

      main {
        padding-top: 55px;
      }

      .upload-box {
        padding: 22px;
      }

      footer {
        flex-direction: column;

        gap: 10px;
      }

      .login-button,
      .user-button,
      .logout-button {
        padding: 8px 11px;
      }

    }

  </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

  <a href="/" class="logo">

    <img src="/logo.png" alt="VladLab">

    <div class="logo-text">
      Vlad<span>Lab</span>
    </div>

  </a>


  <div class="account">

    <div id="loggedOut">

      <a href="/login/" class="login-button">
        Login
      </a>

    </div>


    <div id="loggedIn" class="account">

      <a href="/admin/" class="user-button">
        Vlad
      </a>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</nav>


<!-- MAIN -->

<main>

  <a href="/" class="back">
    ← Înapoi la VladLab
  </a>


  <h1>
    📤 <span>Trimite fișier</span>
  </h1>


  <p class="subtitle">
    Trimite rapid un fișier prin VladLab.
  </p>


  <div class="upload-box">

    <form id="uploadForm">


      <div class="field">

        <label for="name">
          Nume
        </label>

        <input
          type="text"
          id="name"
          placeholder="Numele tău"
          required
        >

      </div>


      <div class="field">

        <label for="message">
          Mesaj
        </label>

        <textarea
          id="message"
          placeholder="Scrie un mesaj opțional..."
        ></textarea>

      </div>


      <div class="field">

        <label for="file">
          Fișier
        </label>

        <input
          type="file"
          id="file"
          required
        >

        <div class="hint">
          Dimensiune maximă: 10 MB
        </div>

      </div>


      <button
        type="submit"
        class="send-button"
        id="sendButton"
      >
        Trimite fișier
      </button>


    </form>


    <div id="status"></div>

  </div>

</main>


<!-- FOOTER -->

<footer>

  <div>
    © 2026 VladLab
  </div>

  <div>
    Upload
  </div>

</footer>


<script type="module">

  /* FIREBASE */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",

    authDomain:
      "vladlab-11887.firebaseapp.com",

    projectId:
      "vladlab-11887",

    storageBucket:
      "vladlab-11887.firebasestorage.app",

    messagingSenderId:
      "741561223788",

    appId:
      "1:741561223788:web:88ad3e62db87e32551a649",

    measurementId:
      "G-9XN16BVYRN"

  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const loggedOut =
    document.getElementById("loggedOut");

  const loggedIn =
    document.getElementById("loggedIn");

  const logoutButton =
    document.getElementById("logoutButton");


  onAuthStateChanged(auth, (user) => {

    if (
      user &&
      user.uid === ADMIN_UID
    ) {

      loggedOut.style.display =
        "none";

      loggedIn.style.display =
        "flex";

    }

    else {

      loggedIn.style.display =
        "none";

      loggedOut.style.display =
        "block";

    }

  });


  logoutButton.addEventListener(
    "click",

    async () => {

      await signOut(auth);

      window.location.reload();

    }
  );


  /* GOOGLE DRIVE UPLOAD */

  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbycRg6W15NRwev2sNSr6lnTw8Lq9LVgwAIdUGrQxasXAQtl3jy7xuLbLI-rH109g9UQ9g/exec";


  const form =
    document.getElementById("uploadForm");

  const sendButton =
    document.getElementById("sendButton");

  const statusBox =
    document.getElementById("status");


  form.addEventListener(
    "submit",

    async (event) => {

      event.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const message =
        document
          .getElementById("message")
          .value
          .trim();


      const file =
        document
          .getElementById("file")
          .files[0];


      if (!file) {

        showError(
          "Selectează un fișier."
        );

        return;
      }


      if (
        file.size >
        10 * 1024 * 1024
      ) {

        showError(
          "Fișierul este prea mare. Limita este de 10 MB."
        );

        return;
      }


      sendButton.disabled = true;

      sendButton.textContent =
        "Se trimite...";


      statusBox.className =
        "loading";

      statusBox.textContent =
        "Se încarcă fișierul...";


      try {

        const fileData =
          await fileToBase64(file);


        const payload = {

          name: name,

          message: message,

          fileName:
            file.name,

          mimeType:
            file.type ||
            "application/octet-stream",

          fileData:
            fileData

        };


        await fetch(

          SCRIPT_URL,

          {

            method: "POST",

            mode: "no-cors",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(payload)

          }

        );


        statusBox.className =
          "success";


        statusBox.innerHTML =
          "<strong>Fișier trimis!</strong><br>Încărcarea a fost finalizată.";


        form.reset();

      }

      catch (error) {

        console.error(error);


        showError(
          "A apărut o problemă la trimiterea fișierului."
        );

      }

      finally {

        sendButton.disabled =
          false;


        sendButton.textContent =
          "Trimite fișier";

      }

    }
  );


  function fileToBase64(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload = () => {

          const base64 =
            reader.result
              .split(",")[1];


          resolve(base64);

        };


        reader.onerror =
          reject;


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  function showError(message) {

    statusBox.className =
      "error";

    statusBox.textContent =
      message;

  }

</script>


</body>

</html>
