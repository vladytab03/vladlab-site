<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trimite fișier | VladLab</title>

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b12;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #1d2330;
      background: rgba(8, 11, 18, 0.94);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .menu-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e131d;
      border: 1px solid #293142;
      border-radius: 12px;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: .2s;
    }

    .menu-button:hover {
      background: #161c27;
      border-color: #5b8cff;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #loggedOut,
    #loggedIn {
      display: none;
    }

    .login-button,
    .user-button,
    .logout-button {
      padding: 9px 15px;
      border-radius: 10px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: .2s;
      white-space: nowrap;
    }

    .login-button {
      background: #5b8cff;
      color: white;
      border: 1px solid #5b8cff;
      font-weight: 700;
    }

    .login-button:hover {
      background: #6c98ff;
    }

    .user-button {
      max-width: 180px;
      background: transparent;
      color: #cbd4e4;
      border: 1px solid #293142;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-button:hover {
      color: white;
      border-color: #5b8cff;
    }

    .logout-button {
      background: #161c27;
      color: white;
      border: 1px solid #293142;
    }

    .logout-button:hover {
      background: #1a2230;
      border-color: #5b8cff;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .62);
      opacity: 0;
      visibility: hidden;
      transition: .25s;
      z-index: 998;
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      max-width: 86vw;
      height: 100vh;
      height: 100dvh;
      background: #0b0f17;
      border-right: 1px solid #202735;
      transform: translateX(-105%);
      transition: transform .28s ease;
      z-index: 999;
      display: flex;
      flex-direction: column;
      box-shadow: 20px 0 50px rgba(0, 0, 0, .35);
    }

    .side-menu.active {
      transform: translateX(0);
    }

    .side-menu-header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #1d2330;
    }

    .side-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 19px;
      font-weight: 700;
    }

    .side-brand img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 10px;
    }

    .close-menu {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #293142;
      background: #111722;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    .side-menu-content {
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow-y: auto;
    }

    .menu-label {
      color: #596477;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      padding: 6px 12px 10px;
    }

    .menu-link {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      color: #cbd4e4;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: .2s;
    }

    .menu-link:hover {
      color: white;
      background: #111722;
      border-color: #202735;
    }

    .menu-link.active {
      color: white;
      background: rgba(91, 140, 255, .12);
      border-color: rgba(91, 140, 255, .25);
    }

    .menu-icon {
      width: 27px;
      text-align: center;
      font-size: 20px;
    }

    .menu-separator {
      height: 1px;
      background: #1d2330;
      margin: 12px 8px;
    }

    .side-menu-footer {
      margin-top: auto;
      padding: 18px 20px;
      border-top: 1px solid #1d2330;
      color: #596477;
      font-size: 12px;
    }

    main {
      flex: 1;
      width: min(850px, 90%);
      margin: auto;
      padding: 80px 0;
    }

    .back {
      color: #71809a;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    h1 {
      font-size: clamp(48px, 7vw, 72px);
      letter-spacing: -3px;
      margin-top: 25px;
    }

    h1 span {
      color: #5b8cff;
    }

    .subtitle {
      margin-top: 10px;
      color: #7f899a;
      font-size: 15px;
    }

    .upload-box {
      margin-top: 45px;
      background: #0e131d;
      border: 1px solid #202735;
      border-radius: 20px;
      padding: 28px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #c7cfdd;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px 15px;
      background: #090d15;
      border: 1px solid #293243;
      border-radius: 11px;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      outline: none;
      transition: .2s;
    }

    input:focus,
    textarea:focus {
      border-color: #5b8cff;
      box-shadow: 0 0 0 3px rgba(91, 140, 255, .10);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input[type="file"] {
      cursor: pointer;
    }

    .hint {
      margin-top: 8px;
      color: #657188;
      font-size: 12px;
    }

    .send-button {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 11px;
      background: #5b8cff;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .send-button:hover {
      background: #6c98ff;
    }

    .send-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #status {
      display: none;
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 11px;
      font-size: 14px;
      line-height: 1.5;
    }

    #status.loading {
      display: block;
      background: rgba(91, 140, 255, .08);
      border: 1px solid rgba(91, 140, 255, .22);
      color: #9bb7ff;
    }

    #status.success {
      display: block;
      background: rgba(58, 210, 120, .08);
      border: 1px solid rgba(58, 210, 120, .22);
      color: #72e7a4;
    }

    #status.error {
      display: block;
      background: rgba(255, 75, 75, .08);
      border: 1px solid rgba(255, 75, 75, .22);
      color: #ff9292;
    }

    footer {
      border-top: 1px solid #1d2330;
      padding: 30px 8%;
      color: #626d7f;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 750px) {
      nav {
        padding: 0 16px;
      }

      main {
        padding-top: 55px;
      }

      .upload-box {
        padding: 22px;
      }

      footer {
        flex-direction: column;
        gap: 10px;
      }

      .login-button,
      .user-button,
      .logout-button {
        padding: 8px 10px;
        font-size: 13px;
      }

      .user-button {
        max-width: 135px;
      }

      .side-menu {
        width: 300px;
      }
    }
  </style>
</head>

<body>

<div id="menuOverlay" class="menu-overlay"></div>

<aside id="sideMenu" class="side-menu">

  <div class="side-menu-header">

    <div class="side-brand">
      <img src="/logo.png" alt="VladLab">
      VladLab
    </div>

    <button
      id="closeMenu"
      class="close-menu"
      type="button"
      aria-label="Închide meniul"
    >
      ×
    </button>

  </div>

  <div class="side-menu-content">

    <div class="menu-label">
      VLADLAB
    </div>

    <a href="/" class="menu-link">
      <span class="menu-icon">🏠</span>
      Acasă
    </a>

    <a href="/scoala/" class="menu-link">
      <span class="menu-icon">🎓</span>
      Școală
    </a>

    <a href="/proiecte/" class="menu-link">
      <span class="menu-icon">💻</span>
      Proiecte
    </a>

    <a href="/upload/" class="menu-link active">
      <span class="menu-icon">📤</span>
      Trimite fișier
    </a>

    <a href="/download/" class="menu-link">
      <span class="menu-icon">📥</span>
      Descărcări
    </a>

    <a href="/favorite/" class="menu-link">
      <span class="menu-icon">❤️</span>
      Favorite
    </a>

    <div class="menu-separator"></div>

    <a href="http://novasmp.space/" class="menu-link">
      <span class="menu-icon">⛏️</span>
      Nova SMP
    </a>

  </div>

  <div class="side-menu-footer">
    © 2026 VladLab
  </div>

</aside>


<nav>

  <button
    id="openMenu"
    class="menu-button"
    type="button"
    aria-label="Deschide meniul"
  >
    ☰
  </button>

  <div class="account">

    <div id="loggedOut">
      <a href="/login/" class="login-button">
        Login
      </a>
    </div>

    <div id="loggedIn" class="account">

      <a
        id="userButton"
        href="/cont/"
        class="user-button"
      >
        Cont
      </a>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </div>

  </div>

</nav>


<main>

  <a href="/" class="back">
    ← Înapoi la VladLab
  </a>

  <h1>
    📤 <span>Trimite fișier</span>
  </h1>

  <p class="subtitle">
    Trimite un fișier către VladLab.
  </p>

  <div class="upload-box">

    <form id="uploadForm">

      <div class="field">

        <label for="name">
          Nume
        </label>

        <input
          id="name"
          type="text"
          placeholder="Numele tău"
          required
        >

      </div>

      <div class="field">

        <label for="message">
          Mesaj
        </label>

        <textarea
          id="message"
          placeholder="Scrie un mesaj opțional..."
        ></textarea>

      </div>

      <div class="field">

        <label for="file">
          Fișier
        </label>

        <input
          id="file"
          type="file"
          required
        >

        <div class="hint">
          Dimensiune maximă: 10 MB
        </div>

      </div>

      <button
        id="sendButton"
        class="send-button"
        type="submit"
      >
        Trimite fișier
      </button>

    </form>

    <div id="status"></div>

  </div>

</main>


<footer>

  <div>
    © 2026 VladLab
  </div>

  <div>
    Trimite fișier
  </div>

</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDwR7COPtyLwIrAtVuH_lpW7Xmb5TCZDKY",
    authDomain: "vladlab-11887.firebaseapp.com",
    projectId: "vladlab-11887",
    storageBucket: "vladlab-11887.firebasestorage.app",
    messagingSenderId: "741561223788",
    appId: "1:741561223788:web:88ad3e62db87e32551a649",
    measurementId: "G-9XN16BVYRN"
  };


  const ADMIN_UID =
    "tSvMc97QFgc35RwSkK7VRRsEIBv2";


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  let signedInUser =
    null;


  /* =========================
     CONTURI
  ========================= */

  const loggedOut =
    document.getElementById("loggedOut");

  const loggedIn =
    document.getElementById("loggedIn");

  const userButton =
    document.getElementById("userButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const nameInput =
    document.getElementById("name");


  onAuthStateChanged(
    auth,
    user => {

      signedInUser =
        user;


      if (!user) {

        loggedIn.style.display =
          "none";

        loggedOut.style.display =
          "block";

        return;
      }


      loggedOut.style.display =
        "none";

      loggedIn.style.display =
        "flex";


      if (!nameInput.value.trim()) {

        nameInput.value =
          user.displayName ||
          user.email?.split("@")[0] ||
          "";

      }


      if (
        user.uid ===
        ADMIN_UID
      ) {

        userButton.textContent =
          "Vlad";

        userButton.href =
          "/admin/";

        return;
      }


      userButton.textContent =
        user.displayName ||
        user.email?.split("@")[0] ||
        "Cont";

      userButton.href =
        "/cont/";

    }
  );


  logoutButton.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

        window.location.href =
          "/";

      }

      catch (error) {

        console.error(error);

      }

    }
  );


  /* =========================
     MENIU
  ========================= */

  const openMenuButton =
    document.getElementById("openMenu");

  const closeMenuButton =
    document.getElementById("closeMenu");

  const sideMenu =
    document.getElementById("sideMenu");

  const menuOverlay =
    document.getElementById("menuOverlay");


  function openMenu() {

    sideMenu.classList.add(
      "active"
    );

    menuOverlay.classList.add(
      "active"
    );

    document.body.classList.add(
      "menu-open"
    );

  }


  function closeMenu() {

    sideMenu.classList.remove(
      "active"
    );

    menuOverlay.classList.remove(
      "active"
    );

    document.body.classList.remove(
      "menu-open"
    );

  }


  openMenuButton.addEventListener(
    "click",
    openMenu
  );


  closeMenuButton.addEventListener(
    "click",
    closeMenu
  );


  menuOverlay.addEventListener(
    "click",
    closeMenu
  );


  document
    .querySelectorAll(".menu-link")
    .forEach(link => {

      link.addEventListener(
        "click",
        closeMenu
      );

    });


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        closeMenu();

      }

    }
  );


  /* =========================
     GOOGLE DRIVE UPLOAD
  ========================= */

  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbycRg6W15NRwev2sNSr6lnTw8Lq9LVgwAIdUGrQxasXAQtl3jy7xuLbLI-rH109g9UQ9g/exec";


  const form =
    document.getElementById("uploadForm");

  const sendButton =
    document.getElementById("sendButton");

  const statusBox =
    document.getElementById("status");


  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const message =
        document
          .getElementById("message")
          .value
          .trim();


      const file =
        document
          .getElementById("file")
          .files[0];


      if (!file) {

        showError(
          "Selectează un fișier."
        );

        return;

      }


      if (
        file.size >
        10 * 1024 * 1024
      ) {

        showError(
          "Fișierul este prea mare. Limita este de 10 MB."
        );

        return;

      }


      sendButton.disabled =
        true;

      sendButton.textContent =
        "Se trimite...";


      statusBox.className =
        "loading";

      statusBox.textContent =
        "Se încarcă fișierul...";


      try {

        const fileData =
          await fileToBase64(file);


        const payload = {
          name,
          message,

          fileName:
            file.name,

          mimeType:
            file.type ||
            "application/octet-stream",

          fileData
        };


        /*
          Păstrăm no-cors deoarece acesta este
          sistemul care trimite deja fișierele
          către Apps Script / Google Drive.
        */

        await fetch(
          SCRIPT_URL,
          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(payload)
          }
        );


        /*
          Dacă utilizatorul este logat,
          înregistrăm trimiterea în contul lui.
        */

        if (signedInUser) {

          await addDoc(
            collection(
              db,
              "users",
              signedInUser.uid,
              "uploads"
            ),
            {
              fileName:
                file.name,

              fileSize:
                file.size,

              mimeType:
                file.type ||
                "application/octet-stream",

              message:
                message,

              senderName:
                name,

              status:
                "trimis",

              createdAt:
                serverTimestamp()
            }
          );

        }


        statusBox.className =
          "success";


        if (signedInUser) {

          statusBox.textContent =
            "Fișierul a fost trimis și a fost salvat în istoricul contului tău!";

        } else {

          statusBox.textContent =
            "Fișierul a fost trimis!";

        }


        form.reset();


        if (signedInUser) {

          nameInput.value =
            signedInUser.displayName ||
            signedInUser.email?.split("@")[0] ||
            "";

        }

      }

      catch (error) {

        console.error(error);


        showError(
          "A apărut o problemă la trimiterea fișierului."
        );

      }

      finally {

        sendButton.disabled =
          false;

        sendButton.textContent =
          "Trimite fișier";

      }

    }
  );


  /* =========================
     FIȘIER -> BASE64
  ========================= */

  function fileToBase64(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload =
          () => {

            const base64 =
              reader.result
                .split(",")[1];

            resolve(
              base64
            );

          };


        reader.onerror =
          reject;


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  /* =========================
     EROARE
  ========================= */

  function showError(message) {

    statusBox.className =
      "error";

    statusBox.textContent =
      message;

  }

</script>

</body>
</html>
